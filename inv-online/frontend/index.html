<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Undangan Pernikahan</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f3ef;color:#344337;font-family:Georgia,serif}.page{max-width:560px;margin:auto;background:#fff;min-height:100vh}.hero{min-height:100vh;display:grid;place-content:center;text-align:center;color:white;padding:30px;background:linear-gradient(#243b2dcc,#243b2dcc),linear-gradient(135deg,#9bab91,#344b39)}.hero h1{font-size:38px;font-weight:400}.section{text-align:center;padding:50px 25px;border-bottom:1px solid #edf0eb}.section h2{font-size:27px;font-weight:400;color:#667f68}.section p{font:14px/1.8 Arial;color:#67736a}.error{padding:80px 25px;text-align:center;font:16px Arial}</style><body><main class="page" id="app"></main><script>(()=>{let slug=location.pathname.split('/').filter(Boolean).pop(),raw=localStorage.getItem('inv-online:'+slug),app=document.getElementById('app');if(!raw){app.innerHTML='<div class="error"><h2>Undangan belum tersedia</h2><p>Data slug ini belum dipublikasikan dari browser yang sama.</p></div>';return}let d=JSON.parse(raw);app.innerHTML=d.sections.filter(s=>s.on).map((s,i)=>i===0?'<section class="hero"><div><small>WEDDING INVITATION</small><h1>'+s.a+'</h1><p>'+s.b+'</p><p>'+s.desc+'</p></div></section>':'<section class="section"><h2>'+s.title+'</h2><b>'+s.a+'</b><p>'+s.b+'</p><p>'+s.desc+'</p></section>').join('');document.title=d.sections[0].a+' — Undangan Pernikahan'})();</script></body></html>
