<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="description" id="dynamicDescription" content="Preview minisite dari Webdesk."><meta property="og:title" id="dynamicOgTitle" content="Preview Event | Webdesk"><meta property="og:description" id="dynamicOgDescription" content="Preview minisite dari Webdesk."><meta property="og:image" id="dynamicOgImage" content=""><title>Preview Event | Webdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* ==========================================
       CSS VARIABLES & RESET (MOBILE-FIRST)
       ========================================== */
    :root {
      --primary: #0F172A;       /* Slate 900 */
      --accent: #0284C7;        /* Sky 600 */
      --accent-hover: #0369A1;  /* Sky 700 */
      --accent-light: #E0F2FE;  /* Sky 100 */
      --emerald: #10B981;       /* WhatsApp / Success Green */
      --emerald-hover: #059669;
      --bg-body: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 20px 35px -10px rgba(2, 132, 199, 0.18);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-body);
      line-height: 1.6;
    }

    body {
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
      object-fit: cover;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .section {
      padding: 64px 0;
    }

    .section-header {
      text-align: center;
      max-width: 640px;
      margin: 0 auto 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background-color: var(--accent-light);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .section-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* ==========================================
       BUTTONS
       ========================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--primary);
      border: 1.5px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      background-color: #FFFFFF;
    }

    .btn-wa {
      background-color: var(--emerald);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-wa:hover {
      background-color: var(--emerald-hover);
      transform: translateY(-2px);
    }

    .btn-full {
      width: 100%;
    }

    /* ==========================================
       NAVBAR (STICKY GLASSMORPHISM)
       ========================================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.5px;
    }

    .brand-text span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-links {
      display: none;
      gap: 28px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-cta {
      padding: 10px 16px;
      font-size: 0.85rem;
    }

/* ==========================================
       HERO SECTION
       ========================================== */
    .hero {
      padding: 40px 0 64px;
      background: radial-gradient(circle at top right, #E0F2FE 0%, transparent 45%),
                  radial-gradient(circle at bottom left, #F1F5F9 0%, transparent 50%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
      align-items: center;
    }

    .hero-title {
      font-size: 2.15rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .hero-title span {
      color: var(--accent);
    }

    .hero-desc {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .hero-meta {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
    }

    .meta-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-visual {
      position: relative;
    }

    .hero-img-wrapper {
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 4px solid #FFFFFF;
      aspect-ratio: 4 / 3;
    }

    .hero-img-wrapper img {
      width: 100%;
      height: 100%;
    }

    .floating-card {
      position: absolute;
      bottom: -16px;
      left: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .floating-stat strong {
      display: block;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .floating-stat span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ==========================================
       BENEFITS / TENTANG ACARA
       ========================================== */
    .benefits-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .benefit-card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .benefit-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #BAE6FD;
    }

    .benefit-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .benefit-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .benefit-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ==========================================
       SCHEDULE / JADWAL ACARA
       ========================================== */
    .schedule-section {
      background-color: #FFFFFF;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .schedule-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .tab-pill {
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: var(--bg-body);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .tab-pill.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .timeline {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .timeline-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      background: var(--bg-body);
      border-radius: var(--radius-md);
      border-left: 4px solid var(--accent);
      transition: var(--transition);
    }

    .timeline-item:hover {
      background: #F1F5F9;
    }

    .timeline-time {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-light);
      padding: 4px 10px;
      border-radius: 6px;
      width: fit-content;
    }

    .timeline-content h4 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .timeline-content p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* ==========================================
       SPEAKERS / PEMBICARA
       ========================================== */
    .speakers-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .speaker-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .speaker-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .speaker-img {
      height: 260px;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #E2E8F0;
    }

    .speaker-img img {
      width: 100%;
      height: 100%;
      object-position: top center;
      transition: transform 0.4s ease;
    }

    .speaker-card:hover .speaker-img img {
      transform: scale(1.04);
    }

    .speaker-info {
      padding: 20px;
    }

    .speaker-role {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .speaker-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .speaker-bio {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .speaker-topic {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 12px;
      background: var(--bg-body);
      border-radius: var(--radius-sm);
      color: var(--primary);
      border: 1px solid var(--border);
    }

/* ==========================================
       PRICING / INVESTASI TIKET
       ========================================== */
    .pricing-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      max-width: 980px;
      margin: 0 auto;
    }

    .price-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 28px 24px;
      box-shadow: var(--shadow-sm);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .price-card.featured {
      border: 2px solid var(--accent);
      box-shadow: var(--shadow-lg);
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
    }

    .popular-tag {
      position: absolute;
      top: -13px;
      right: 24px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }

    .price-tier {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .price-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .price-amount {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .price-strike {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: line-through;
      display: block;
    }

    .price-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
    }

    .price-value small {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .price-features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .price-features li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      color: var(--text-main);
    }

    .check-icon {
      color: var(--emerald);
      font-weight: 800;
      flex-shrink: 0;
    }

    /* ==========================================
       REGISTRATION FORM SECTION
       ========================================== */
    .register-section {
      background: var(--primary);
      color: #FFFFFF;
      position: relative;
      overflow: hidden;
    }

    .register-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: center;
    }

    .register-info .badge {
      background: rgba(2, 132, 199, 0.25);
      color: #38BDF8;
    }

    .register-info .section-title {
      color: #FFFFFF;
      text-align: left;
    }

    .register-info p {
      color: #94A3B8;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .guarantee-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .guarantee-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      color: #E2E8F0;
    }

    .guarantee-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.2);
      color: #34D399;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .form-card {
      background: #FFFFFF;
      color: var(--text-main);
      padding: 28px 24px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
    }

    .form-card h3 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .form-card > p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text-main);
      background: var(--bg-body);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .form-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 12px;
    }

    /* ==========================================
       FOOTER
       ========================================== */
    .footer {
      background: #0B1120;
      color: #94A3B8;
      padding: 48px 0 90px; /* Extra bottom padding for mobile sticky bar */
      font-size: 0.88rem;
      border-top: 1px solid #1E293B;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      margin-bottom: 32px;
    }

    .footer .brand {
      color: #FFFFFF;
      margin-bottom: 12px;
    }

    .footer h4 {
      color: #FFFFFF;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-links a:hover {
      color: #38BDF8;
    }

    .footer-bottom {
      padding-top: 24px;
      border-top: 1px solid #1E293B;
      text-align: center;
      font-size: 0.8rem;
    }

    /* ==========================================
       FLOATING WHATSAPP & MOBILE BOTTOM BAR
       ========================================== */
    .mobile-sticky-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 99;
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.08);
    }

    .sticky-price span {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .sticky-price strong {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .sticky-buttons {
      display: flex;
      gap: 8px;
    }

    .sticky-buttons .btn {
      padding: 10px 16px;
      font-size: 0.85rem;
    }

    .floating-wa-desktop {
      display: none;
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 99;
      background: var(--emerald);
      color: #FFFFFF;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      align-items: center;
      gap: 10px;
      transition: var(--transition);
    }

    .floating-wa-desktop:hover {
      background: var(--emerald-hover);
      transform: translateY(-3px);
    }

    /* ==========================================
       RESPONSIVE BREAKPOINTS (TABLET & DESKTOP)
       ========================================== */
    @media (min-width: 768px) {
      .section {
        padding: 88px 0;
      }

      .section-title {
        font-size: 2.25rem;
      }

      .nav-links {
        display: flex;
      }

      .hero {
        padding: 64px 0 96px;
      }

      .hero-grid {
        grid-template-columns: 1.1fr 0.9fr;
        gap: 48px;
      }

      .hero-title {
        font-size: 2.85rem;
      }

      .hero-meta {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 20px;
      }

      .hero-actions {
        flex-direction: row;
      }

      .benefits-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }

      .timeline-item {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .timeline-time {
        min-width: 150px;
        justify-content: center;
      }

      .timeline-content {
        flex: 1;
      }

      .speakers-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .pricing-grid {
        grid-template-columns: repeat(3, 1fr);
        align-items: stretch;
      }

      .register-grid {
        grid-template-columns: 1fr 1fr;
        gap: 56px;
      }

      .form-card {
        padding: 36px 32px;
      }

      .footer {
        padding: 64px 0 32px;
      }

      .footer-grid {
        grid-template-columns: 1.5fr 1fr 1fr;
      }

      .mobile-sticky-cta {
        display: none;
      }

      .floating-wa-desktop {
        display: inline-flex;
      }
    }

    /* ==========================================
       MOBILE-ONLY MINISITE PRESENTATION
       Keep the complete page in a centered mobile-width canvas.
       ========================================== */
    html {
      background: #e9eef5;
    }

    body {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg-body);
      overflow-x: hidden;
      box-shadow: 0 0 32px rgba(15, 23, 42, 0.08);
    }

    .navbar {
      display: none !important;
    }

    .container {
      width: 100%;
      max-width: 100%;
      padding-left: 14px;
      padding-right: 14px;
    }

    .section {
      padding: 38px 0;
    }

    .hero {
      padding: 28px 0 38px;
    }

    .hero-grid,
    .benefits-grid,
    .speakers-grid,
    .pricing-grid,
    .register-grid,
    .footer-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 16px;
    }

    .hero-grid {
      gap: 22px;
    }

    .hero-title {
      font-size: 1.9rem;
    }

    .hero-actions {
      display: grid;
      grid-template-columns: 1fr;
    }

    .hero-visual {
      margin: 0;
    }

    .floating-card {
      position: relative;
      inset: auto;
      margin: -18px 10px 0;
      z-index: 1;
      gap: 8px;
      padding: 12px;
    }

    .floating-stat strong {
      font-size: 0.95rem;
    }

    .floating-stat span {
      font-size: 0.68rem;
    }

    .section-header {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.45rem;
    }

    .benefit-card,
    .speaker-card,
    .price-card,
    .form-card,
    .timeline-item {
      width: 100%;
      min-width: 0;
    }

    .speaker-img {
      height: 220px;
    }

    .pricing-grid {
      max-width: 100%;
    }

    .register-grid {
      gap: 22px;
    }

    .footer-grid {
      gap: 24px;
    }

    .mobile-sticky-cta,
    .floating-wa-desktop {
      display: none !important;
    }

    .footer {
      padding-bottom: 28px;
    }

    @media (min-width: 431px) {
      body {
        max-width: 430px;
      }
    }

  
#testNotice{max-width:430px;margin:18px auto;padding:18px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md)}
#testNotice h1{font-size:1.2rem;color:var(--primary);margin-bottom:8px}#testNotice p{font-size:.86rem;color:var(--text-muted);margin-bottom:12px}
#testNotice input{width:100%;padding:12px;border:1px solid var(--border);border-radius:8px;font:inherit;margin-bottom:10px}
#testNotice button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:700 .9rem inherit}
#renderError{display:none;background:#fff1f2;color:#9f1239;padding:12px;border-radius:8px;font-size:.82rem;margin-top:10px}
#dynamicPage[hidden],#testNotice[hidden]{display:none!important}
.hero-image-section{padding:0 0 36px}.hero-image-section .hero-img-wrapper{aspect-ratio:16/9}
.speaker-img{aspect-ratio:3/4;height:auto}.speaker-img img{object-fit:cover}
@media(max-width:430px){.hero-image-section{padding:0 0 28px}}
</style></head><body>
<div id="testNotice"><h1>Preview Minisite dari Backend</h1><p>Masukkan slug event yang sudah dipublikasikan untuk melihat hasil render dari database.</p><form id="slugForm"><input id="slugInput" placeholder="contoh: workshop-tenaga-medis" autocomplete="off" required><button type="submit">Tampilkan Preview</button></form><div id="renderError"></div></div>
<main id="dynamicPage" hidden>
<div id="navbarMount"></div><div id="heroMount"></div><div id="heroImageMount"></div><div id="materialsMount"></div><div id="agendaMount"></div><div id="speakersMount"></div><div id="pricingMount"></div><div id="registrationMount"></div><div id="footerMount"></div><div id="stickyMount"></div>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0));
const fmtDate=v=>v?new Date(v+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'';
function sectionOn(map,key){return !map[key]||map[key].is_visible!==false}
function badge(t){return t?'<span class="badge">'+esc(t)+'</span>':''}
function render(data){
 const m=data.minisite, s=data.sections||{}, materials=data.materials||[],agenda=data.agenda||[],speakers=data.speakers||[],pricing=data.pricing||[];
 document.title=esc(m.title)+' | '+esc(m.organizer||'Event');
 const metaTitle=m.seo_meta_title||m.title+' | '+(m.organizer||'Event');
 const metaDescription=m.seo_meta_description||m.description||'';
 document.getElementById('dynamicDescription').content=metaDescription;
 document.getElementById('dynamicOgTitle').content=metaTitle;
 document.getElementById('dynamicOgDescription').content=metaDescription;
 if(m.seo_og_image_url)document.getElementById('dynamicOgImage').content=m.seo_og_image_url;
 if(m.seo_canonical_url){let canonical=document.createElement('link');canonical.rel='canonical';canonical.href=m.seo_canonical_url;document.head.appendChild(canonical);}
 if(m.theme_primary_color)document.documentElement.style.setProperty('--primary',m.theme_primary_color);
 const dateText=[fmtDate(m.start_date),fmtDate(m.end_date)].filter(Boolean).join(' – ');
 if(sectionOn(s,'navbar'))$('#navbarMount').innerHTML='<header class="navbar" style="display:block!important"><div class="container nav-container"><a href="#" class="brand"><div class="brand-logo">'+esc(m.navbar_brand||m.organizer||'Event')+'</div><div class="brand-text">'+esc(m.organizer||m.title)+'</div></a><nav class="nav-links"><a href="#materi">Materi</a><a href="#jadwal">Jadwal</a><a href="#pembicara">Pembicara</a><a href="#investasi">Paket</a></nav><a href="#daftar" class="btn btn-primary nav-cta">'+esc(m.navbar_button_label||'Daftar')+'</a></div></header>';
 if(sectionOn(s,'hero'))$('#heroMount').innerHTML='<section class="hero"><div class="container hero-grid"><div class="hero-content">'+badge(m.hero_eyebrow)+'<h1 class="hero-title">'+esc(m.hero_title||m.title)+'</h1><p class="hero-desc">'+esc(m.hero_description||m.description)+'</p><div class="hero-meta">'+(dateText?'<div class="meta-item"><div class="meta-icon">▦</div><div>'+esc(dateText)+'</div></div>':'')+(m.event_format||m.location?'<div class="meta-item"><div class="meta-icon">⌖</div><div>'+esc([m.event_format,m.location].filter(Boolean).join(' · '))+'</div></div>':'')+'</div><div class="hero-actions"><a href="#daftar" class="btn btn-primary">'+esc(m.hero_primary_cta||'Daftar Sekarang')+'</a>'+(m.hero_secondary_cta?'<a href="#jadwal" class="btn btn-outline">'+esc(m.hero_secondary_cta)+'</a>':'')+'</div></div></div></section>';
 if(sectionOn(s,'hero_image')&&m.hero_image_url)$('#heroImageMount').innerHTML='<section class="hero-image-section"><div class="container"><div class="hero-img-wrapper"><img src="'+esc(m.hero_image_url)+'" alt="'+esc(m.hero_image_alt||m.title)+'"></div></div></section>';
 if(sectionOn(s,'materi_acara'))$('#materialsMount').innerHTML=materials.length?'<section id="materi" class="section"><div class="container"><div class="section-header">'+badge('Materi Acara')+'<h2 class="section-title">'+esc(m.materi_heading||'Materi Acara')+'</h2></div><div class="benefits-grid">'+materials.map(x=>'<article class="benefit-card"><div class="benefit-icon">✓</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p></article>').join('')+'</div></div></section>':'';
 if(sectionOn(s,'schedule'))$('#agendaMount').innerHTML=agenda.length?'<section id="jadwal" class="section schedule-section"><div class="container"><div class="section-header">'+badge('Rundown Acara')+'<h2 class="section-title">'+esc(m.schedule_heading||'Jadwal & Agenda')+'</h2></div><div class="timeline">'+agenda.map(x=>'<article class="timeline-item"><div class="timeline-time">'+esc([x.day_label,x.time_label].filter(Boolean).join(' · '))+'</div><div class="timeline-content"><h4>'+esc(x.title)+'</h4><p>'+esc(x.description)+'</p></div></article>').join('')+'</div></div></section>':'';
 if(sectionOn(s,'speakers'))$('#speakersMount').innerHTML=speakers.length?'<section id="pembicara" class="section"><div class="container"><div class="section-header">'+badge('Mentor & Praktisi')+'<h2 class="section-title">'+esc(m.speakers_heading||'Pembicara')+'</h2></div><div class="speakers-grid">'+speakers.map(x=>'<article class="speaker-card">'+(x.image_url?'<div class="speaker-img"><img src="'+esc(x.image_url)+'" alt="'+esc(x.name)+'"></div>':'')+'<div class="speaker-info"><div class="speaker-role">'+esc(x.role)+'</div><h3 class="speaker-name">'+esc(x.name)+'</h3><p class="speaker-bio">'+esc(x.bio)+'</p>'+(x.topic?'<div class="speaker-topic">'+esc(x.topic)+'</div>':'')+'</div></article>').join('')+'</div></div></section>':'';
 if(sectionOn(s,'pricing'))$('#pricingMount').innerHTML=pricing.length?'<section id="investasi" class="section"><div class="container"><div class="section-header">'+badge('Pilihan Paket')+'<h2 class="section-title">'+esc(m.pricing_heading||'Pilihan Paket')+'</h2></div><div class="pricing-grid">'+pricing.map(x=>'<article class="price-card '+(x.is_featured?'featured':'')+'">'+(x.badge?'<div class="popular-tag">'+esc(x.badge)+'</div>':'')+'<div><div class="price-tier">'+esc(x.name)+'</div><p class="price-desc">'+esc(x.description)+'</p><div class="price-amount">'+(x.original_price?'<span class="price-strike">'+money(x.original_price)+'</span>':'')+'<div class="price-value">'+money(x.price)+' <small>'+esc(x.unit_label||'')+'</small></div></div><ul class="price-features">'+(x.features||[]).map(f=>'<li><span class="check-icon">✓</span>'+esc(f)+'</li>').join('')+'</ul></div><a href="#daftar" class="btn btn-primary btn-full" data-package="'+esc(x.name)+'">'+esc(x.button_label||'Pilih Paket')+'</a></article>').join('')+'</div></div></section>':'';
 if(sectionOn(s,'registration'))$('#registrationMount').innerHTML='<section id="daftar" class="section register-section"><div class="container register-grid"><div class="register-info">'+badge('Registrasi Peserta')+'<h2 class="section-title">'+esc(m.registration_heading||'Daftar Sekarang')+'</h2><p>'+esc(m.registration_description||'Lengkapi formulir pendaftaran berikut.')+'</p></div><div class="form-card"><h3>Formulir Pendaftaran</h3><p>Lengkapi data diri Anda.</p><form id="registrationForm"><div class="form-group"><label>Nama Lengkap *</label><input class="form-control" name="full_name" required></div><div class="form-group"><label>Nomor WhatsApp *</label><input class="form-control" name="whatsapp" type="tel" required></div><div class="form-group"><label>Email</label><input class="form-control" name="email" type="email"></div><div class="form-group"><label>Pendidikan</label><input class="form-control" name="education"></div><div class="form-group"><label>Pilihan Paket</label><select class="form-control" name="selected_package"><option value="">Pilih paket</option>'+pricing.map(x=>'<option>'+esc(x.name)+'</option>').join('')+'</select></div><button class="btn btn-wa btn-full" type="submit">'+esc(m.registration_button_label||'Kirim Pendaftaran')+'</button><p id="formMessage" class="form-note"></p></form></div></div></section>';
 if(sectionOn(s,'footer'))$('#footerMount').innerHTML='<footer class="footer"><div class="container"><div class="footer-grid"><div><a class="brand" href="#"><div class="brand-logo">'+esc(m.navbar_brand||m.organizer||'Event')+'</div><div class="brand-text">'+esc(m.footer_organization||m.organizer||m.title)+'</div></a></div><div><h4>Kontak</h4><div class="footer-links"><span>'+esc(m.footer_address)+'</span><span>'+esc(m.footer_whatsapp)+'</span><span>'+esc(m.footer_email)+'</span></div></div></div><div class="footer-bottom">© '+new Date().getFullYear()+' '+esc(m.footer_organization||m.organizer||m.title)+'.</div></div></footer>';
 if(sectionOn(s,'sticky_cta'))$('#stickyMount').innerHTML='<div class="mobile-sticky-cta"><div class="sticky-price"><span>'+esc(m.sticky_cta_text||'Pendaftaran dibuka')+'</span><strong>'+esc(pricing.length?'Mulai '+money(Math.min(...pricing.map(p=>Number(p.price||0)))):'')+'</strong></div><div class="sticky-buttons"><a href="#daftar" class="btn btn-primary">'+esc(m.sticky_cta_button_label||'Daftar')+'</a></div></div>';
 document.querySelectorAll('[data-package]').forEach(a=>a.addEventListener('click',()=>{const sel=$('#registrationForm select[name="selected_package"]');if(sel)sel.value=a.dataset.package}));
 const form=$('#registrationForm');if(form)form.addEventListener('submit',async e=>{e.preventDefault();const btn=form.querySelector('button[type="submit"]');btn.disabled=true;try{const fd=new FormData(form);const body=Object.fromEntries(fd.entries());const res=await fetch('/api/minisites/'+encodeURIComponent(m.slug),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const out=await res.json();if(!res.ok)throw new Error(out.error||'Gagal mengirim pendaftaran');$('#formMessage').textContent='Pendaftaran berhasil dikirim.';form.reset()}catch(err){$('#formMessage').textContent=err.message}finally{btn.disabled=false}});
 $('#testNotice').hidden=true;$('#dynamicPage').hidden=false;
}
async function load(slug){const err=$('#renderError');err.style.display='none';try{const r=await fetch('/api/minisites/'+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw new Error(d.error||'Event tidak ditemukan');const byKey={};(d.sections||[]).forEach(x=>byKey[x.section_key]=x);render({minisite:d.minisite,sections:byKey,materials:d.materials,agenda:d.agenda,speakers:d.speakers,pricing:d.pricing})}catch(e){err.textContent=e.message;err.style.display='block'}}
const initial=new URLSearchParams(location.search).get('slug');if(initial){$('#slugInput').value=initial;load(initial)}
$('#slugForm').addEventListener('submit',e=>{e.preventDefault();const s=$('#slugInput').value.trim().toLowerCase();history.replaceState(null,'','?slug='+encodeURIComponent(s));load(s)});
</script></body></html>
