<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontend Minisite | Webdesk</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

    /* ==========================================
       CSS VARIABLES & RESET (MOBILE-FIRST)
       ========================================== */
    :root {
      --primary: #0F172A;       /* Slate 900 */
      --accent: #0284C7;        /* Sky 600 */
      --accent-hover: #0369A1;  /* Sky 700 */
      --accent-light: #E0F2FE;  /* Sky 100 */
      --emerald: #10B981;       /* WhatsApp / Success Green */
      --emerald-hover: #059669;
      --bg-body: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 20px 35px -10px rgba(2, 132, 199, 0.18);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-body);
      line-height: 1.6;
    }

    body {
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
      object-fit: cover;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .section {
      padding: 64px 0;
    }

    .section-header {
      text-align: center;
      max-width: 640px;
      margin: 0 auto 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background-color: var(--accent-light);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .section-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* ==========================================
       BUTTONS
       ========================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--primary);
      border: 1.5px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      background-color: #FFFFFF;
    }

    .btn-wa {
      background-color: var(--emerald);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    }

    .btn-wa:hover {
      background-color: var(--emerald-hover);
      transform: translateY(-2px);
    }

    .btn-full {
      width: 100%;
    }

    /* ==========================================
       NAVBAR (STICKY GLASSMORPHISM)
       ========================================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary);
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.5px;
    }

    .brand-text span {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-links {
      display: none;
      gap: 28px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-cta {
      padding: 10px 16px;
      font-size: 0.85rem;
    }

/* ==========================================
       HERO SECTION
       ========================================== */
    .hero {
      padding: 40px 0 64px;
      background: radial-gradient(circle at top right, #E0F2FE 0%, transparent 45%),
                  radial-gradient(circle at bottom left, #F1F5F9 0%, transparent 50%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px;
      align-items: center;
    }

    .hero-title {
      font-size: 2.15rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .hero-title span {
      color: var(--accent);
    }

    .hero-desc {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .hero-meta {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
      padding: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
    }

    .meta-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-visual {
      position: relative;
    }

    .hero-img-wrapper {
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 4px solid #FFFFFF;
      aspect-ratio: 4 / 3;
    }

    .hero-img-wrapper img {
      width: 100%;
      height: 100%;
    }

    .floating-card {
      position: absolute;
      bottom: -16px;
      left: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .floating-stat strong {
      display: block;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .floating-stat span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ==========================================
       BENEFITS / TENTANG ACARA
       ========================================== */
    .benefits-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .benefit-card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .benefit-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #BAE6FD;
    }

    .benefit-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .benefit-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .benefit-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ==========================================
       SCHEDULE / JADWAL ACARA
       ========================================== */
    .schedule-section {
      background-color: #FFFFFF;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .schedule-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .tab-pill {
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: var(--bg-body);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .tab-pill.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .timeline {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .timeline-item {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 20px;
      background: var(--bg-body);
      border-radius: var(--radius-md);
      border-left: 4px solid var(--accent);
      transition: var(--transition);
    }

    .timeline-item:hover {
      background: #F1F5F9;
    }

    .timeline-time {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-light);
      padding: 4px 10px;
      border-radius: 6px;
      width: fit-content;
    }

    .timeline-content h4 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .timeline-content p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* ==========================================
       SPEAKERS / PEMBICARA
       ========================================== */
    .speakers-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .speaker-card {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .speaker-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .speaker-img {
      height: 260px;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #E2E8F0;
    }

    .speaker-img img {
      width: 100%;
      height: 100%;
      object-position: top center;
      transition: transform 0.4s ease;
    }

    .speaker-card:hover .speaker-img img {
      transform: scale(1.04);
    }

    .speaker-info {
      padding: 20px;
    }

    .speaker-role {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .speaker-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .speaker-bio {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .speaker-topic {
      font-size: 0.8rem;
      font-weight: 600;
      padding: 8px 12px;
      background: var(--bg-body);
      border-radius: var(--radius-sm);
      color: var(--primary);
      border: 1px solid var(--border);
    }

/* ==========================================
       PRICING / INVESTASI TIKET
       ========================================== */
    .pricing-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      max-width: 980px;
      margin: 0 auto;
    }

    .price-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 28px 24px;
      box-shadow: var(--shadow-sm);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .price-card.featured {
      border: 2px solid var(--accent);
      box-shadow: var(--shadow-lg);
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
    }

    .popular-tag {
      position: absolute;
      top: -13px;
      right: 24px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }

    .price-tier {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .price-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .price-amount {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .price-strike {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: line-through;
      display: block;
    }

    .price-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
    }

    .price-value small {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .price-features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .price-features li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      color: var(--text-main);
    }

    .check-icon {
      color: var(--emerald);
      font-weight: 800;
      flex-shrink: 0;
    }

    /* ==========================================
       REGISTRATION FORM SECTION
       ========================================== */
    .register-section {
      background: var(--primary);
      color: #FFFFFF;
      position: relative;
      overflow: hidden;
    }

    .register-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: center;
    }

    .register-info .badge {
      background: rgba(2, 132, 199, 0.25);
      color: #38BDF8;
    }

    .register-info .section-title {
      color: #FFFFFF;
      text-align: left;
    }

    .register-info p {
      color: #94A3B8;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .guarantee-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .guarantee-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      color: #E2E8F0;
    }

    .guarantee-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.2);
      color: #34D399;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .form-card {
      background: #FFFFFF;
      color: var(--text-main);
      padding: 28px 24px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
    }

    .form-card h3 {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .form-card > p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text-main);
      background: var(--bg-body);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .form-note {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 12px;
    }

    /* ==========================================
       FOOTER
       ========================================== */
    .footer {
      background: #0B1120;
      color: #94A3B8;
      padding: 48px 0 90px; /* Extra bottom padding for mobile sticky bar */
      font-size: 0.88rem;
      border-top: 1px solid #1E293B;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
      margin-bottom: 32px;
    }

    .footer .brand {
      color: #FFFFFF;
      margin-bottom: 12px;
    }

    .footer h4 {
      color: #FFFFFF;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .footer-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-links a:hover {
      color: #38BDF8;
    }

    .footer-bottom {
      padding-top: 24px;
      border-top: 1px solid #1E293B;
      text-align: center;
      font-size: 0.8rem;
    }

    /* ==========================================
       FLOATING WHATSAPP & MOBILE BOTTOM BAR
       ========================================== */
    .mobile-sticky-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 99;
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.08);
    }

    .sticky-price span {
      display: block;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .sticky-price strong {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .sticky-buttons {
      display: flex;
      gap: 8px;
    }

    .sticky-buttons .btn {
      padding: 10px 16px;
      font-size: 0.85rem;
    }

    .floating-wa-desktop {
      display: none;
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 99;
      background: var(--emerald);
      color: #FFFFFF;
      padding: 14px 20px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      align-items: center;
      gap: 10px;
      transition: var(--transition);
    }

    .floating-wa-desktop:hover {
      background: var(--emerald-hover);
      transform: translateY(-3px);
    }

    /* ==========================================
       RESPONSIVE BREAKPOINTS (TABLET & DESKTOP)
       ========================================== */
    @media (min-width: 768px) {
      .section {
        padding: 88px 0;
      }

      .section-title {
        font-size: 2.25rem;
      }

      .nav-links {
        display: flex;
      }

      .hero {
        padding: 64px 0 96px;
      }

      .hero-grid {
        grid-template-columns: 1.1fr 0.9fr;
        gap: 48px;
      }

      .hero-title {
        font-size: 2.85rem;
      }

      .hero-meta {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 20px;
      }

      .hero-actions {
        flex-direction: row;
      }

      .benefits-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }

      .timeline-item {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .timeline-time {
        min-width: 150px;
        justify-content: center;
      }

      .timeline-content {
        flex: 1;
      }

      .speakers-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .pricing-grid {
        grid-template-columns: repeat(3, 1fr);
        align-items: stretch;
      }

      .register-grid {
        grid-template-columns: 1fr 1fr;
        gap: 56px;
      }

      .form-card {
        padding: 36px 32px;
      }

      .footer {
        padding: 64px 0 32px;
      }

      .footer-grid {
        grid-template-columns: 1.5fr 1fr 1fr;
      }

      .mobile-sticky-cta {
        display: none;
      }

      .floating-wa-desktop {
        display: inline-flex;
      }
    }

    /* ==========================================
       MOBILE-ONLY MINISITE PRESENTATION
       Keep the complete page in a centered mobile-width canvas.
       ========================================== */
    html {
      background: #e9eef5;
    }

    body {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg-body);
      overflow-x: hidden;
      box-shadow: 0 0 32px rgba(15, 23, 42, 0.08);
    }

    .navbar {
      display: none !important;
    }

    .container {
      width: 100%;
      max-width: 100%;
      padding-left: 14px;
      padding-right: 14px;
    }

    .section {
      padding: 38px 0;
    }

    .hero {
      padding: 28px 0 38px;
    }

    .hero-grid,
    .benefits-grid,
    .speakers-grid,
    .pricing-grid,
    .register-grid,
    .footer-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 16px;
    }

    .hero-grid {
      gap: 22px;
    }

    .hero-title {
      font-size: 1.9rem;
    }

    .hero-actions {
      display: grid;
      grid-template-columns: 1fr;
    }

    .hero-visual {
      margin: 0;
    }

    .floating-card {
      position: relative;
      inset: auto;
      margin: -18px 10px 0;
      z-index: 1;
      gap: 8px;

    }

    .floating-stat strong {
      font-size: 0.95rem;
    }

    .floating-stat span {
      font-size: 0.68rem;
    }

    .section-header {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 1.45rem;
    }

    .benefit-card,
    .speaker-card,
    .price-card,
    .form-card,
    .timeline-item {
      width: 100%;
      min-width: 0;
    }

    .speaker-img {
      height: 220px;
    }

    .pricing-grid {
      max-width: 100%;
    }

    .register-grid {
      gap: 22px;
    }

    .footer-grid {
      gap: 24px;
    }

    .mobile-sticky-cta,
    .floating-wa-desktop {
      display: none !important;
    }

    .footer {
      padding-bottom: 28px;
    }

    @media (min-width: 431px) {
      body {
        max-width: 430px;
      }
    }

  
/* Blank renderer structure: no event content is hardcoded. */
.empty-line{height:14px;background:#e8eef5;border-radius:6px;margin:10px 0;width:72%}
.empty-line.short{width:42%}.empty-line.long{width:92%}
.empty-title{height:32px;background:#e8eef5;border-radius:7px;width:76%;margin:14px 0}
.empty-image{background:#edf2f7;border:1px dashed #cbd5e1;border-radius:var(--radius-lg);aspect-ratio:16/9;display:grid;place-items:center;color:#94a3b8;font-size:.8rem}
.empty-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:24px;box-shadow:var(--shadow-sm);min-height:180px}
.empty-avatar{width:100%;aspect-ratio:3/4;background:#edf2f7;border-radius:var(--radius-md);margin-bottom:14px}
.empty-price{height:34px;width:55%;background:#e8eef5;border-radius:7px;margin:18px 0}
.empty-input{height:44px;border:1px solid var(--border);border-radius:var(--radius-sm);margin:8px 0 16px;background:#fff}
.empty-section-note{font-size:.75rem;color:#94a3b8;text-align:center;margin-top:14px}
.hero-image-section{padding:0 0 48px}
@media(max-width:430px){.empty-title{height:26px}.empty-card{padding:18px}}
</style>
</head>
<body>
<header class="navbar"><div class="container nav-container">

<script>
(async function(){
 const slug=new URLSearchParams(location.search).get('slug')||'hospital-triage-workshop';
 const api='/api/minisites/'+encodeURIComponent(slug);
 const $=(s,r=document)=>r.querySelector(s);
 const $$=(s,r=document)=>[...r.querySelectorAll(s)];
 const setText=(el,value,kind='body')=>{
  if(!el)return;
  el.classList.remove('empty-line','empty-title','empty-price');
  el.removeAttribute('style');
  el.textContent=value||'';
  if(kind==='title'){el.style.cssText='width:auto;height:auto;background:none;border-radius:0;margin:0 0 16px;font-size:2rem;line-height:1.2;font-weight:800;color:var(--primary)';}
  else if(kind==='heading'){el.style.cssText='width:auto;height:auto;background:none;border-radius:0;margin:0 auto 12px;font-size:1.45rem;line-height:1.3;font-weight:800;color:var(--primary)';}
  else if(kind==='badge'){el.style.cssText='width:fit-content;height:auto;background:var(--accent-light);border-radius:999px;padding:6px 14px;margin:0 0 14px;display:inline-flex';}
  else if(kind==='body'){el.style.cssText='width:auto;height:auto;background:none;border-radius:0;margin:0 0 18px;color:var(--text-muted);font-size:1rem;line-height:1.7';}
  else if(kind==='cardtitle'){el.style.cssText='width:auto;height:auto;background:none;border-radius:0;margin:0 0 8px;color:var(--primary);font-size:1.05rem;font-weight:800;line-height:1.4';}
  else if(kind==='small'){el.style.cssText='width:auto;height:auto;background:none;border-radius:0;margin:0 0 8px;color:var(--text-muted);font-size:.9rem;line-height:1.6';}
 };
 try{
  const response=await fetch(api,{cache:'no-store'});if(!response.ok)throw new Error('Workshop belum dipublikasikan.');
  const data=await response.json(),m=data.minisite||{},sections=Object.fromEntries((data.sections||[]).map(s=>[s.section_key,s]));
  const visible=k=>sections[k]?.is_visible!==false;
  document.title=m.seo_meta_title||m.title||'Workshop';
  const meta=$('meta[name="description"]');if(meta)meta.content=m.seo_meta_description||m.description||'';
  document.documentElement.style.setProperty('--accent',m.theme_primary_color||'#173b70');
  const nav=$('.navbar');if(nav&&visible('navbar')){setText($('.brand-text span',nav),m.navbar_brand,'small');setText($('.nav-cta',nav),m.navbar_button_label)}else nav?.remove();
  const hero=$('.hero');
  if(hero&&visible('hero')){
   const c=$('.hero-content',hero),badge=$('.badge',c),oldTitles=$$('.empty-title',c),oldLines=$$('.empty-line',c);
   setText(badge,m.hero_eyebrow,'badge');
   const h=document.createElement('h1');h.className='hero-title';h.textContent=m.hero_title||m.title||'';oldTitles[0]?.replaceWith(h);oldTitles.slice(1).forEach(x=>x.remove());
   const p=document.createElement('p');p.className='hero-description';p.textContent=m.hero_description||m.description||'';oldLines[0]?.replaceWith(p);oldLines.slice(1).forEach(x=>x.remove());
   $('.hero-meta',c)?.remove();
   const buttons=$$('.hero-actions .btn',c);setText(buttons[0],m.hero_primary_cta||'Register Now');setText(buttons[1],m.hero_secondary_cta||'View Schedule');
   buttons[0]&& (buttons[0].style.width='100%');buttons[1]&&(buttons[1].style.width='100%');
  }else hero?.remove();
  const imageSection=$('.hero-image-section');if(imageSection)imageSection.remove();
  const heading=(section,value)=>{const el=$('.section-header .empty-title, .section-header .section-title',section);if(el)setText(el,value,'heading');$('.section-header .badge',section)?.remove()};
  const cards=(rootSelector,items,render)=>{
   const root=$(rootSelector);if(!root)return;
   const template=root.firstElementChild;
   if(!items?.length){root.closest('.section')?.remove();return}
   root.innerHTML='';
   items.forEach(item=>{const node=template.cloneNode(true);render(node,item);root.appendChild(node)});
  };
  const materi=$('#materi');if(materi&&visible('materi_acara')){
   heading(materi,m.materi_heading||'Workshop Learning Modules');
   cards('#materi .benefits-grid',data.materials,(n,x)=>{
    $('.benefit-icon',n)?.remove();const lines=$$('.empty-line',n);
    setText(lines[0],x.title,'cardtitle');setText(lines[1],x.description,'body');lines.slice(2).forEach(e=>e.remove());
   });
  }else materi?.remove();
  const schedule=$('#jadwal');if(schedule&&visible('schedule')){
   heading(schedule,m.schedule_heading||'Workshop Agenda');
   cards('#jadwal .timeline',data.agenda,(n,x)=>{
    const lines=$$('.empty-line',n);setText(lines[0],[x.day_label,x.time_label].filter(Boolean).join(' · '),'small');
    setText(lines[1],x.title,'cardtitle');setText(lines[2],x.description,'body');
   });
  }else schedule?.remove();
  const speakers=$('#pembicara');if(speakers&&visible('speakers')){
   heading(speakers,m.speakers_heading||'Meet the Instructors');
   cards('#pembicara .speakers-grid',data.speakers,(n,x)=>{
    const lines=$$('.empty-line',n);setText(lines[0],x.name,'cardtitle');setText(lines[1],x.role,'small');setText(lines[2],x.bio,'body');
    const avatar=$('.empty-avatar',n);if(x.image_url&&avatar){const img=document.createElement('img');img.src=x.image_url;img.alt=x.name;img.className='speaker-img';avatar.replaceWith(img)}else avatar?.remove();
   });
  }else speakers?.remove();
  const pricing=$('#paket');if(pricing&&visible('pricing')){
   heading(pricing,m.pricing_heading||'Registration Packages');
   cards('#paket .pricing-grid',data.pricing,(n,x)=>{
    const lines=$$('.empty-line',n),price=$('.empty-price',n);
    setText(lines[0],x.name,'cardtitle');setText(price,(Number(x.price)||0).toLocaleString('en-US')+' '+(x.unit_label||''),'title');
    setText(lines[1],x.description,'small');lines.slice(2).forEach(e=>e.remove());
    const btn=$('.btn',n);if(btn)setText(btn,x.button_label||'Select Package');
   });
  }else pricing?.remove();
  const reg=$('#daftar');if(reg&&visible('registration')){
   const info=$('.register-info',reg);if(info){$('.badge',info)?.remove();setText($('.empty-title',info),m.registration_heading||'Join the Hospital Triage Workshop','title');const lines=$$('.empty-line',info);setText(lines[0],m.registration_description,'body');lines.slice(1).forEach(e=>e.remove())}
   const card=$('.form-card',reg);if(card){
    card.innerHTML='<h3>Workshop Registration</h3><p>Complete the form to reserve your place.</p><form id="workshopRegister"><div class="form-group"><label>Full Name</label><input class="form-control" name="full_name" required></div><div class="form-group"><label>WhatsApp</label><input class="form-control" name="whatsapp" required></div><div class="form-group"><label>Email</label><input class="form-control" type="email" name="email"></div><div class="form-group"><label>Education / Profession</label><input class="form-control" name="education"></div><div class="form-group"><label>Package</label><select class="form-control" name="selected_package">'+(data.pricing||[]).map(x=>'<option>'+x.name+'</option>').join('')+'</select></div><button class="btn btn-wa btn-full" type="submit">'+(m.registration_button_label||'Submit Registration')+'</button><p id="registerMessage" class="form-note"></p></form>';
    $('#workshopRegister').onsubmit=async e=>{e.preventDefault();const form=Object.fromEntries(new FormData(e.target));const rr=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(form)});const result=await rr.json();$('#registerMessage').textContent=rr.ok?'Registration received. Thank you!':(result.error||'Registration failed.')};
   }
  }else reg?.remove();
  const footer=$('.footer');if(footer&&visible('footer')){const lines=$$('.empty-line',footer);setText(lines[0],m.footer_organization,'cardtitle');setText(lines[1],m.footer_address,'small');lines.slice(2).forEach(e=>e.remove())}else footer?.remove();
  $('.mobile-sticky-cta')?.remove();
 }catch(e){document.body.innerHTML='<main style="font:16px sans-serif;padding:32px"><h1>Workshop not available</h1><p>'+e.message+'</p></main>'}
})();
</script>
</body></html>
