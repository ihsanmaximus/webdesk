<script>
const chapters=[
 {n:"01",slug:"01-executive-summary",title:"Ringkasan Eksekutif",desc:"Tujuan, peluang, dan arah pengembangan",photo:"photo-1497366754035-f200968a6e72",lead:"Membangun kanal digital resmi yang memperkuat layanan dan jangkauan RLC.",body:`<p>Rifdaira Learning Center (RLC) memiliki peran dalam pengembangan kompetensi tenaga medis dan tenaga kesehatan melalui kegiatan pelatihan, workshop, webinar, dan bimbingan teknis. Potensi tersebut perlu didukung oleh kanal digital resmi yang informasinya mudah ditemukan, dipercaya, dan diperbarui.</p><p>Melalui proposal ini, Webdesk by Maximus Lab mengajukan pengembangan website RLC sebagai pusat informasi program, pendaftaran peserta, publikasi kegiatan, dan komunikasi kemitraan. Website dirancang untuk membantu calon peserta memahami program dan mengambil langkah pendaftaran dengan lebih mudah.</p><p>Pengembangan dilakukan bertahap. Fitur yang memerlukan akses atau persetujuan pihak ketiga—termasuk integrasi sistem SKP Kemenkes—akan dibahas dan diverifikasi sebelum dijanjikan sebagai fitur aktif.</p>`,aside:"Tujuan utama",asideText:"Menyatukan informasi, meningkatkan kepercayaan, mempermudah pendaftaran, dan membuka peluang kemitraan institusi."},
 {n:"02",slug:"02-profil-analisis-rlc",title:"Profil & Analisis RLC",desc:"Profil lembaga, layanan, dan aset digital",photo:"photo-1576091160399-112ba8d25d1d",lead:"Memahami identitas, layanan, dan rekam aktivitas RLC.",body:`<p>Rifdaira Learning Center merupakan lembaga pelatihan yang berpusat di Palembang, Sumatera Selatan, dengan fokus pada pembelajaran dan peningkatan kompetensi tenaga kesehatan. Kelompok sasaran yang relevan meliputi dokter, perawat, bidan, tenaga rekam medis, serta tenaga kesehatan dan pengelola fasilitas pelayanan kesehatan lainnya.</p><p>Aktivitas yang teridentifikasi mencakup pelatihan, workshop, webinar, dan bimbingan teknis. Topik yang relevan antara lain kompetensi klinis, manajemen pelayanan kesehatan, keselamatan pasien, rekam medis, serta aspek hukum dan mutu layanan kesehatan.</p><p>RLC memiliki kanal YouTube dengan nama Rifdaira Learning Center. Informasi kegiatan juga ditemukan melalui publikasi digital dan kanal komunikasi lainnya. Status akreditasi dan rincian legalitas perlu ditampilkan berdasarkan dokumen resmi terbaru dari RLC, termasuk nama lembaga penerbit, nomor, masa berlaku, dan ruang lingkupnya. Data jumlah kegiatan dan peserta akan dimasukkan setelah dikonfirmasi bersama RLC.</p>`,aside:"Catatan verifikasi",asideText:"Profil, status akreditasi, angka kegiatan, dan data jangkauan akan dicocokkan dengan dokumen serta data internal RLC sebelum proposal final."},
 {n:"03",slug:"03-peluang-pengembangan",title:"Peluang Pengembangan",desc:"Kesenjangan informasi dan peluang layanan",photo:"photo-1551288049-bebda4e38f71",lead:"Mengubah informasi yang tersebar menjadi pengalaman layanan yang terarah.",body:`<p>Informasi program dan dokumentasi kegiatan yang tersebar di beberapa kanal dapat menyulitkan calon peserta untuk menemukan jadwal, persyaratan, biaya, serta cara pendaftaran dalam satu tempat. Website resmi dapat menjadi rujukan utama yang menghubungkan seluruh kanal publikasi RLC.</p><p>Alur pendaftaran yang masih mengandalkan formulir terpisah atau komunikasi langsung dapat dibuat lebih terstruktur melalui halaman program dan formulir minat/pendaftaran. Admin juga akan lebih mudah mengelola informasi yang masuk dan menindaklanjuti calon peserta.</p><p>Peluang lain adalah penyediaan informasi pelatihan untuk rumah sakit, klinik, Puskesmas, dan institusi kesehatan. Halaman kemitraan dapat menjelaskan pilihan pelatihan bagi kelompok atau kebutuhan khusus institusi.</p><p>Audit ini merupakan evaluasi atas jejak digital yang dapat diakses publik. Data trafik, konversi, dan proses administrasi internal belum tersedia untuk dinilai secara kuantitatif.</p>`,aside:"Peluang prioritas",asideText:"Pusat informasi program, pendaftaran yang lebih ringkas, dokumentasi kegiatan, dan kanal permintaan pelatihan institusi."},
 {n:"04",slug:"04-arah-strategis",title:"Arah Strategis",desc:"Positioning, kepercayaan, dan pertumbuhan",photo:"photo-1500530855697-b586d89ba3ee",lead:"Memperjelas keunggulan RLC melalui informasi yang konsisten dan terverifikasi.",body:`<p>Website RLC perlu menempatkan identitas lembaga, kompetensi program, narasumber, dokumentasi kegiatan, dan legalitas yang dapat diverifikasi sebagai informasi utama. Setiap klaim tentang akreditasi, SKP, sertifikat, atau pengakuan profesi harus sesuai dokumen dan ketentuan yang berlaku.</p><p>Strategi pengembangan dibangun melalui empat fokus:</p><ul><li><strong>Kepercayaan:</strong> profil lembaga, legalitas, narasumber, dan dokumentasi kegiatan.</li><li><strong>Informasi program:</strong> katalog pelatihan dengan jadwal, sasaran profesi, persyaratan, dan biaya.</li><li><strong>Kemudahan layanan:</strong> formulir pendaftaran dan tindak lanjut yang jelas.</li><li><strong>Kemitraan institusi:</strong> jalur permintaan pelatihan untuk rumah sakit dan fasilitas kesehatan.</li></ul><p>Konten media sosial dapat diarahkan ke halaman program yang relevan sehingga calon peserta memperoleh informasi lengkap sebelum menghubungi admin.</p>`,aside:"Posisi yang diusulkan",asideText:"RLC sebagai mitra pembelajaran tenaga kesehatan dengan informasi program yang jelas, kredibel, dan mudah diakses."},
 {n:"05",slug:"05-solusi-model-website",title:"Solusi & Model Website",desc:"Konsep website dan pengalaman pengguna",photo:"photo-1498050108023-c5249f4df085",lead:"Website resmi yang berfungsi sebagai pusat informasi dan pintu layanan.",body:`<p>Solusi yang diusulkan adalah website resmi RLC dengan tampilan profesional, responsif, dan nyaman digunakan melalui ponsel. Pengunjung dapat mengenal lembaga, melihat program yang tersedia, membaca informasi kegiatan, dan menghubungi tim RLC melalui alur yang jelas.</p><p>Struktur utama website meliputi:</p><ul><li>Beranda dengan identitas, keunggulan, dan program unggulan.</li><li>Profil lembaga, legalitas, tim, dan narasumber.</li><li>Katalog pelatihan beserta detail jadwal, sasaran peserta, persyaratan, dan biaya.</li><li>Halaman berita, artikel, webinar, serta dokumentasi kegiatan.</li><li>Formulir pendaftaran atau permintaan informasi.</li><li>Halaman kemitraan dan kontak resmi.</li></ul><p>Konten dan fitur akan disusun berdasarkan prioritas operasional RLC. Website tidak akan menampilkan data atau program simulasi sebagai informasi kegiatan nyata.</p>`,aside:"Prinsip pengalaman pengguna",asideText:"Informasi penting mudah ditemukan, langkah pendaftaran jelas, dan tampilan tetap nyaman pada layar ponsel."},
 {n:"06",slug:"06-fitur-modul-utama",title:"Fitur & Modul Utama",desc:"Fitur inti dan pengembangan lanjutan",photo:"photo-1584982751601-97dcc096659c",lead:"Memulai dari fitur yang dibutuhkan, lalu berkembang sesuai kesiapan.",body:`<p><strong>Fitur tahap awal:</strong></p><ul><li>Pengelolaan halaman profil dan informasi lembaga.</li><li>Pengelolaan katalog, jadwal, dan detail program pelatihan.</li><li>Formulir pendaftaran/minat yang mengirimkan data kepada admin.</li><li>Artikel, berita, dan dokumentasi kegiatan.</li><li>Tombol komunikasi resmi dan informasi lokasi.</li><li>Pengaturan dasar SEO dan analitik sesuai persetujuan RLC.</li></ul><p><strong>Pengembangan berikutnya:</strong> akun peserta, riwayat pendaftaran, pembayaran daring, penerbitan dan verifikasi sertifikat internal, serta dashboard laporan dapat dipertimbangkan setelah proses kerja dan kebutuhan datanya disepakati.</p><p>Verifikasi sertifikat internal dapat dirancang dengan kode unik atau QR. Namun, integrasi langsung dengan Plataran Sehat, SIAKSI, atau sistem SKP Kemenkes bukan bagian yang dapat dijamin tanpa akses, dokumentasi teknis, dan persetujuan resmi dari pihak pengelola sistem.</p>`,aside:"Batasan integrasi",asideText:"Fitur integrasi eksternal hanya dilaksanakan setelah akses dan ketentuan teknis dari pemilik sistem dikonfirmasi."},
 {n:"07",slug:"07-arsitektur-sistem",title:"Arsitektur Sistem",desc:"Pengelolaan konten, data, dan keamanan",photo:"photo-1558494949-ef010cbdcc31",lead:"Fondasi teknis yang mudah dikelola dan dapat dikembangkan.",body:`<p>Website dibangun dengan pendekatan modular agar halaman publik, pengelolaan konten, dan formulir pendaftaran dapat dikembangkan secara terpisah. Admin RLC akan memperoleh alur pengelolaan informasi yang disepakati, sehingga pembaruan jadwal dan konten tidak selalu bergantung pada pengembang.</p><p>Data pendaftar harus dikumpulkan secukupnya sesuai kebutuhan layanan. Pengelolaan akses admin, perlindungan data, pencadangan, dan prosedur pemulihan akan ditetapkan dalam tahap teknis. Informasi pribadi peserta tidak ditampilkan kepada publik.</p><p>Layanan hosting, domain, email, penyimpanan, dan layanan pihak ketiga akan dijelaskan secara transparan dalam rincian final. Kepemilikan akun dan akses administratif perlu disepakati sejak awal proyek.</p>`,aside:"Prinsip pengelolaan",asideText:"Akses sesuai peran, pengumpulan data seperlunya, pencadangan, dan dokumentasi serah terima."},
 {n:"08",slug:"08-investasi",title:"Investasi",desc:"Estimasi biaya dan skema pembayaran",photo:"photo-1554224155-6726b3ff858f",lead:"Penawaran awal disusun agar ruang lingkup dan biaya terbaca jelas.",body:`<p>Estimasi investasi awal yang tercantum dalam rancangan penawaran ini adalah <strong>Rp14.500.000</strong> untuk pengembangan website dan modul inti sesuai ruang lingkup yang disepakati. Nilai tersebut merupakan estimasi awal, bukan tagihan atau kesepakatan final.</p><p>Nilai final akan ditetapkan setelah pembahasan kebutuhan, jumlah halaman dan modul, kesiapan konten, kebutuhan integrasi, serta layanan pihak ketiga. Biaya domain, hosting, lisensi, payment gateway, atau layanan eksternal—jika diperlukan—akan dijelaskan terpisah sebelum disetujui.</p><p><strong>Skema pembayaran usulan:</strong></p><ul><li>50% setelah ruang lingkup dan penawaran disetujui.</li><li>30% setelah rancangan tampilan dan struktur disetujui.</li><li>20% setelah pengujian akhir dan serah terima.</li></ul><p>Perubahan di luar ruang lingkup yang disepakati akan dibahas dan mendapat persetujuan RLC terlebih dahulu.</p>`,aside:"Estimasi awal",asideText:"Rp14.500.000 · Nilai dan rincian akhir menunggu pembahasan serta persetujuan kedua pihak."},
 {n:"09",slug:"09-roadmap-implementasi",title:"Roadmap Implementasi",desc:"Tahapan kerja dan estimasi waktu",photo:"photo-1506784983877-45594efa4cbe",lead:"Tahapan kerja dengan hasil dan persetujuan pada setiap fase.",body:`<p>Estimasi pengerjaan awal adalah <strong>4–6 minggu</strong> sejak ruang lingkup disetujui dan materi utama tersedia. Jadwal dapat berubah mengikuti kelengkapan konten, umpan balik, dan kebutuhan integrasi.</p><ol><li><strong>Penyelarasan kebutuhan:</strong> konfirmasi tujuan, audiens, layanan, materi, dan prioritas fitur.</li><li><strong>Struktur dan rancangan:</strong> susunan halaman, alur pengguna, dan persetujuan desain.</li><li><strong>Pengembangan:</strong> pembangunan website, katalog, formulir, dan pengelolaan konten.</li><li><strong>Pengisian dan pengujian:</strong> memasukkan materi yang disetujui, uji tampilan ponsel/desktop, formulir, dan fungsi utama.</li><li><strong>Peluncuran dan serah terima:</strong> konfigurasi domain, pelatihan admin, dokumentasi, dan pemindahan akses sesuai kesepakatan.</li></ol><p>Setiap tahap memiliki hasil yang dapat ditinjau RLC. Tahap berikutnya dilanjutkan setelah hasil tahap sebelumnya mendapat persetujuan.</p>`,aside:"Estimasi waktu",asideText:"4–6 minggu, dengan ketergantungan pada kesiapan materi dan kecepatan persetujuan."}
];

function card(c,i){return '<a class="chapter-card '+(i===0?'selected':'')+'" href="/penawaran/rlc/bab/'+c.slug+'/" aria-label="Buka bab '+c.n+': '+c.title+'"><span class="card-photo" style="background-image:url('+image(c.photo,900)+')"></span><div class="card-copy"><h3>'+c.title+'</h3><p>'+c.desc+'</p></div><span class="card-number">'+c.n+'</span></a>'}
function renderOverview(){let out='<section class="hero"><div class="hero-copy"><div class="eyebrow">Proposal Pengembangan Digital</div><h1>Rifdaira Learning Center (RLC)</h1><p>Strategi dan solusi digital untuk memperkuat peran RLC sebagai pusat pengembangan kompetensi tenaga kesehatan.</p></div><div class="hero-photo"></div></section><section class="prolog"><span class="prolog-tag">Pengantar Proposal</span><p>RLC telah membangun aktivitas pembelajaran tenaga kesehatan. Proposal ini menguraikan bagaimana kanal digital resmi dapat memperjelas informasi, memperluas jangkauan, dan menyederhanakan pengalaman calon peserta serta mitra institusi.</p></section><section id="proposal"><div class="section-head"><div><span class="section-kicker">ISI PROPOSAL</span><h2>Jelajahi Proposal</h2></div><p>Pilih bab untuk membuka pembahasan lengkap. Setiap kartu menuju halaman tersendiri.</p></div><div class="card-grid">'+chapters.slice(0,3).map(card).join('')+'</div>'+interlude(0)+'<div class="card-grid">'+chapters.slice(3,6).map((c,i)=>card(c,i+3)).join('')+'</div>'+interlude(1)+'<div class="card-grid">'+chapters.slice(6,9).map((c,i)=>card(c,i+6)).join('')+'</div>'+interlude(2)+'</section><section class="cta"><div><h2>Mari Bangun Ekosistem Digital RLC</h2><p>Diskusikan ruang lingkup dan langkah awal pengembangan bersama Webdesk.</p></div><a href="#ringkasan">Diskusikan Proposal ↗</a></section><section class="summary" id="ringkasan"><h2>Ringkasan Penawaran</h2><div class="summary-grid"><div class="summary-item"><small>Solusi</small><strong>Website & Training Management</strong></div><div class="summary-item"><small>Estimasi investasi awal</small><strong>Rp14.500.000</strong></div><div class="summary-item"><small>Estimasi pengerjaan</small><strong>4–6 minggu</strong></div><div class="summary-item"><small>Status</small><strong>Menunggu pembahasan</strong></div></div></section><footer class="footer"><span><strong>Webdesk</strong> by Maximus Lab</span><span>Proposal pengembangan digital untuk RLC · 2026</span></footer>';document.getElementById("main").innerHTML=out;reveal()}
function interlude(i){const q=interludes[i];return '<section class="interlude '+(i===1?'reverse':'')+'"><div class="interlude-copy"><span class="interlude-label">A moment to reflect · 0'+(i+1)+'</span><blockquote>“'+q.quote+'”</blockquote></div><div class="interlude-photo" style="background-image:url('+image(q.photo,1200)+')"></div></section>'}
function renderChapter(c){const i=chapters.indexOf(c),prev=chapters[i-1],next=chapters[i+1];document.title=c.title+' — Proposal RLC';document.getElementById("main").innerHTML='<section class="chapter-page"><div class="crumb"><a href="/penawaran/rlc/">Proposal RLC</a> / '+c.title+'</div><section class="chapter-hero"><div class="chapter-bg" style="background-image:url('+image(c.photo,1400)+')"></div><div class="chapter-hero-copy"><span class="chapter-index">BAB '+c.n+' / 09</span><h1>'+c.title+'</h1><p>'+c.lead+'</p></div></section><div class="chapter-body"><article class="chapter-panel"><h2>'+c.title+'</h2>'+c.body+'</article><aside class="chapter-aside"><strong>'+c.aside+'</strong><p>'+c.asideText+'</p></aside></div><nav class="chapter-nav">'+(prev?'<a href="/penawaran/rlc/bab/'+prev.slug+'/">← '+prev.title+'</a>':'<a href="/penawaran/rlc/">← Kembali ke Overview</a>')+(next?'<a class="next" href="/penawaran/rlc/bab/'+next.slug+'/">'+next.title+' →</a>':'<a class="next" href="/penawaran/rlc/">Kembali ke Ringkasan →</a>')+'</nav></section><footer class="footer"><span><strong>Webdesk</strong> by Maximus Lab</span><span>Proposal pengembangan digital untuk RLC · 2026</span></footer>'}
function reveal(){const els=document.querySelectorAll(".chapter-card");if(!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("revealed"));return}const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){const el=entry.target;const siblings=[...el.parentElement.querySelectorAll(".chapter-card")];el.style.transitionDelay=(siblings.indexOf(el)*110)+"ms";el.classList.add("revealed");io.unobserve(el)}}),{threshold:.12,rootMargin:"0px 0px -35px 0px"});els.forEach(el=>io.observe(el))}
const path=decodeURI(location.pathname),slug=path.match(/\/bab\/([^/]+)/)?.[1],current=chapters.find(c=>c.slug===slug);if(current)renderChapter(current);else renderOverview();
