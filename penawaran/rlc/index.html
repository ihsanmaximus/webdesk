 {n:"01",slug:"01-executive-summary",title:"Executive Summary",desc:"Gambaran utama, peluang, dan tujuan",photo:"photo-1497366754035-f200968a6e72",lead:"Gambaran menyeluruh mengenai arah transformasi digital RLC.",body:"Proposal ini menawarkan pengembangan kehadiran digital RLC menjadi pusat informasi dan layanan pembelajaran tenaga kesehatan. Fokusnya adalah memperjelas kredibilitas, memudahkan calon peserta menemukan program, dan membuka jalur kemitraan institusi.",aside:"Arah utama",asideText:"Membangun kanal resmi yang menyatukan informasi program, pendaftaran, komunikasi, dan kepercayaan."},
 {n:"02",slug:"02-profil-analisis-rlc",title:"Profil & Analisis RLC",desc:"Rekam jejak, capaian, dan temuan utama",photo:"photo-1576091160399-112ba8d25d1d",lead:"Memahami aset, aktivitas, dan kebutuhan komunikasi RLC.",body:"Bagian ini merangkum profil lembaga, aktivitas pelatihan, kanal komunikasi, serta temuan audit digital yang menjadi dasar rekomendasi. Angka dan klaim publik akan ditampilkan dengan atribusi sumber yang jelas.",aside:"Prinsip audit",asideText:"Memisahkan fakta terverifikasi, pernyataan RLC, dan peluang yang masih perlu dikonfirmasi."},

 {n:"05",slug:"05-solusi-model-website",title:"Solusi & Model Website",desc:"Konsep model, pengalaman pengguna, dan layanan",photo:"photo-1498050108023-c5249f4df085",lead:"Website sebagai pusat informasi dan layanan pembelajaran RLC.",body:"Model yang diusulkan menggabungkan website institusi, katalog program, manajemen kegiatan, formulir pendaftaran, artikel, dan ruang informasi peserta. Modul dapat dikembangkan bertahap mengikuti prioritas dan kesiapan operasional.",aside:"Model solusi",asideText:"Corporate website + training management + learning commerce secara bertahap."},

 {n:"07",slug:"07-arsitektur-sistem",title:"Arsitektur Sistem",desc:"Teknologi, integrasi, dan keamanan data",photo:"photo-1558494949-ef010cbdcc31",lead:"Arsitektur sederhana, terukur, dan siap dikembangkan.",body:"Struktur teknis akan memisahkan tampilan publik, pengelolaan konten, data pendaftaran, dan layanan pihak ketiga. Hak akses, perlindungan data, pencadangan, serta kebutuhan integrasi ditetapkan sesuai ruang lingkup final.",aside:"Pendekatan",asideText:"Bangun fondasi yang stabil terlebih dahulu, lalu tambah modul sesuai kebutuhan nyata."},

];

function renderOverview(){let out='<section class="hero"><div class="hero-copy"><div class="eyebrow">Proposal Pengembangan Digital</div><h1>Rifdaira Learning Center (RLC)</h1><p>Strategi dan solusi digital untuk memperkuat peran RLC sebagai pusat pengembangan kompetensi tenaga kesehatan.</p></div><div class="hero-photo"></div></section><section class="prolog"><span class="prolog-tag">Pengantar Proposal</span><p>RLC telah membangun aktivitas pembelajaran tenaga kesehatan. Proposal ini menguraikan bagaimana kanal digital resmi dapat memperjelas informasi, memperluas jangkauan, dan menyederhanakan pengalaman calon peserta serta mitra institusi.</p></section><section id="proposal"><div class="section-head"><div><span class="section-kicker">ISI PROPOSAL</span><h2>Jelajahi Proposal</h2></div><p>Pilih bab untuk membuka pembahasan lengkap. Setiap kartu menuju halaman tersendiri.</p></div><div class="card-grid">'+chapters.slice(0,3).map(card).join('')+'</div>'+interlude(0)+'<div class="card-grid">'+chapters.slice(3,6).map((c,i)=>card(c,i+3)).join('')+'</div>'+interlude(1)+'<div class="card-grid">'+chapters.slice(6,9).map((c,i)=>card(c,i+6)).join('')+'</div>'+interlude(2)+'</section><section class="cta"><div><h2>Mari Bangun Ekosistem Digital RLC</h2><p>Diskusikan ruang lingkup dan langkah awal pengembangan bersama Webdesk.</p></div><a href="#ringkasan">Diskusikan Proposal ↗</a></section><section class="summary" id="ringkasan"><h2>Ringkasan Penawaran</h2><div class="summary-grid"><div class="summary-item"><small>Solusi</small><strong>Website & Training Management</strong></div><div class="summary-item"><small>Estimasi investasi awal</small><strong>Rp14.500.000</strong></div><div class="summary-item"><small>Estimasi pengerjaan</small><strong>4–6 minggu</strong></div><div class="summary-item"><small>Status</small><strong>Menunggu pembahasan</strong></div></div></section><footer class="footer"><span><strong>Webdesk</strong> by Maximus Lab</span><span>Proposal pengembangan digital untuk RLC · 2026</span></footer>';document.getElementById("main").innerHTML=out;reveal()}
function interlude(i){const q=interludes[i];return '<section class="interlude"><div class="interlude-copy"><span class="interlude-label">A moment to reflect · 0'+(i+1)+'</span><blockquote>“'+q.quote+'”</blockquote></div><div class="interlude-photo" style="background-image:url('+image(q.photo,1200)+')"></div></section>'}
function renderChapter(c){const i=chapters.indexOf(c),prev=chapters[i-1],next=chapters[i+1];document.title=c.title+' — Proposal RLC';document.getElementById("main").innerHTML='<section class="chapter-page"><div class="crumb"><a href="/penawaran/rlc/">Proposal RLC</a> / '+c.title+'</div><section class="chapter-hero"><div class="chapter-bg" style="background-image:url('+image(c.photo,1400)+')"></div><div class="chapter-hero-copy"><span class="chapter-index">BAB '+c.n+' / 09</span><h1>'+c.title+'</h1><p>'+c.lead+'</p></div></section><div class="chapter-body"><article class="chapter-panel"><h2>'+c.title+'</h2><p>'+c.body+'</p><p>Rincian, data pendukung, dan keputusan teknis pada bab ini akan disempurnakan dalam pembahasan bersama RLC. Informasi yang memerlukan konfirmasi akan ditandai secara jelas sebelum menjadi komitmen implementasi.</p></article><aside class="chapter-aside"><strong>'+c.aside+'</strong><p>'+c.asideText+'</p></aside></div><nav class="chapter-nav">'+(prev?'<a href="/penawaran/rlc/bab/'+prev.slug+'/">← '+prev.title+'</a>':'<a href="/penawaran/rlc/">← Kembali ke Overview</a>')+(next?'<a class="next" href="/penawaran/rlc/bab/'+next.slug+'/">'+next.title+' →</a>':'<a class="next" href="/penawaran/rlc/">Kembali ke Ringkasan →</a>')+'</nav></section><footer class="footer"><span><strong>Webdesk</strong> by Maximus Lab</span><span>Proposal pengembangan digital untuk RLC · 2026</span></footer>'}
function reveal(){const els=document.querySelectorAll(".chapter-card");if(!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("revealed"));return}const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){const el=entry.target;const siblings=[...el.parentElement.querySelectorAll(".chapter-card")];el.style.transitionDelay=(siblings.indexOf(el)*110)+"ms";el.classList.add("revealed");io.unobserve(el)}}),{threshold:.12,rootMargin:"0px 0px -35px 0px"});els.forEach(el=>io.observe(el))}
const path=decodeURI(location.pathname),slug=path.match(/\/bab\/([^/]+)/)?.[1],current=chapters.find(c=>c.slug===slug);if(current)renderChapter(current);else renderOverview();
const sidebar=document.getElementById("sidebar"),app=document.getElementById("app");document.getElementById("sideToggle").addEventListener("click",()=>{sidebar.classList.toggle("open");app.classList.toggle("sidebar-open")});document.getElementById("mobileMenu").addEventListener("click",()=>sidebar.classList.toggle("open"));document.addEventListener("keydown",e=>{if(e.key==="Escape"){sidebar.classList.remove("open");app.classList.remove("sidebar-open")}});
</script>
