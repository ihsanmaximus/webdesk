 {n:"01",slug:"01-executive-summary",title:"Executive Summary",desc:"Ringkasan temuan, peluang, dan arah pengembangan",photo:"photo-1497366754035-f200968a6e72",lead:"RLC telah memiliki aktivitas pembelajaran yang dapat dikembangkan menjadi ekosistem kelembagaan yang lebih terhubung.",sections:[
  {h:"Gambaran saat ini",p:"Rifdaira Learning Center (RLC) menyelenggarakan kegiatan pendidikan dan peningkatan kompetensi bagi tenaga medis dan tenaga kesehatan. Publikasi media tanggal 22 Agustus 2026 menyebutkan 13 kegiatan dalam periode Oktober 2025–Agustus 2026 dengan sekitar 525 peserta dari berbagai wilayah Indonesia. Kegiatan yang diberitakan meliputi pelatihan, webinar, dan workshop."},
  {h:"Peluang yang terlihat",p:"Rekam kegiatan tersebut menunjukkan bahwa RLC telah memiliki tiga modal penting: program pembelajaran yang beragam, pengalaman menyelenggarakan kegiatan, dan jangkauan peserta lintas wilayah. Modal ini dapat diperkuat dengan pengelolaan informasi, konten, kegiatan, data peserta, alumni, serta rekam pelatihan yang saling terhubung."},
  {h:"Arah pengembangan",p:"Proposal ini mengajak RLC melihat website bukan sebagai produk akhir, melainkan sebagai salah satu pintu masuk menuju lingkungan digital yang mendukung pekerjaan lembaga. Sistem dirancang agar tim RLC dapat lebih fokus pada mutu pendidikan dan pelatihan, sementara proses informasi dan administrasi yang berulang dibantu oleh alur digital yang tertata."},
  {h:"Hasil yang dituju",p:"RLC memiliki pusat informasi resmi, proses publikasi dan pendaftaran yang lebih jelas, pengelolaan kegiatan dan peserta yang terdokumentasi, serta fondasi data untuk membangun hubungan berkelanjutan dengan alumni dan mitra institusi. Pengembangan dilakukan bertahap sesuai kebutuhan dan kesiapan RLC."}
 ],aside:"Inti usulan",asideText:"Memperkuat kapasitas RLC melalui ekosistem digital yang menghubungkan informasi, konten, kegiatan, peserta, rekam pelatihan, dan kemitraan.",evidence:"Sumber utama: publikasi LamanQu, 22 Agustus 2026. Angka kegiatan dan peserta merupakan data yang diberitakan media berdasarkan keterangan pimpinan RLC, bukan hasil audit database internal."},
 {n:"02",slug:"02-profil-analisis-rlc",title:"Profil & Analisis RLC",desc:"Rekam jejak, aktivitas, dan temuan berbasis sumber",photo:"photo-1576091160399-112ba8d25d1d",lead:"Membaca kapasitas RLC dari aktivitas dan informasi yang telah dipublikasikan.",sections:[
  {h:"Bidang kegiatan",p:"Publikasi yang tersedia menggambarkan RLC sebagai lembaga yang berfokus pada pendidikan dan peningkatan kompetensi tenaga medis serta tenaga kesehatan. Tema kegiatan yang diberitakan mencakup kompetensi klinis, manajemen, administrasi, keselamatan kerja, regulasi, dan mutu pelayanan kesehatan."},
  {h:"Rekam kegiatan yang dipublikasikan",p:"Dalam periode Oktober 2025 hingga Agustus 2026, publikasi tersebut mencatat 13 kegiatan dan sekitar 525 peserta. Rinciannya antara lain empat pelatihan ANC dan USG, dua pelatihan PPI, empat webinar, serta empat workshop. Karena rincian kategori yang disebutkan berjumlah lebih banyak daripada total 13 kegiatan, angka agregat dan rincian perlu dikonfirmasi kepada RLC sebelum dijadikan statistik resmi proposal."},
  {h:"Jangkauan peserta",p:"Artikel menyebut peserta pelatihan dan workshop berasal antara lain dari Jambi, Batam, Bangka, dan Belitung. Peserta webinar disebut menjangkau wilayah Sumatera, Jawa, Kalimantan, dan Sulawesi. Ini merupakan indikasi jangkauan lintas wilayah berdasarkan publikasi, bukan pengukuran independen terhadap sebaran seluruh peserta."},
  {h:"Batas temuan saat ini",p:"Sumber publik yang ditemukan belum cukup untuk memastikan kondisi database peserta, sistem pendaftaran, proses penerbitan sertifikat, status akreditasi terkini, volume traffic website, atau konsistensi publikasi media sosial RLC. Hal-hal tersebut perlu diverifikasi melalui dokumen dan akses yang diberikan RLC. Proposal ini tidak menganggap ketiadaan data publik sebagai bukti bahwa sistem internal belum tersedia."}
 ],aside:"Kesimpulan awal",asideText:"RLC telah menunjukkan aktivitas dan jangkauan program. Langkah berikutnya adalah memetakan bagaimana informasi, peserta, dan rekam kegiatan saat ini dikelola.",evidence:"Sumber: LamanQu, 22 Agustus 2026; Berita Suara Rakyat, 22 Agustus 2026. Kedua publikasi memuat materi siaran pers yang serupa, sehingga tidak dihitung sebagai dua verifikasi independen."},
 {n:"03",slug:"03-peluang-pengembangan",title:"Peluang Pengembangan",desc:"Potensi yang dapat dibuka dari aktivitas RLC",photo:"photo-1551288049-bebda4e38f71",lead:"Aktivitas yang sudah berjalan dapat menjadi dasar untuk memperluas jangkauan dan kesinambungan layanan.",sections:[
  {h:"Dari kegiatan menjadi program berkelanjutan",p:"Setiap pelatihan, webinar, dan workshop dapat ditampilkan sebagai bagian dari katalog program RLC. Informasi yang konsisten—tujuan, sasaran peserta, materi, narasumber, jadwal, metode, dan ketentuan—membantu calon peserta memahami program sebelum menghubungi panitia."},
  {h:"Dari peserta menjadi jaringan",p:"Peserta yang mengikuti kegiatan dapat menjadi bagian dari hubungan jangka panjang RLC. Dengan persetujuan dan tata kelola data yang tepat, riwayat keikutsertaan dapat membantu RLC menyampaikan program lanjutan, mengundang alumni, serta memahami minat pembelajaran berdasarkan kelompok profesi atau topik."},
  {h:"Dari dokumentasi menjadi sumber informasi",p:"Materi edukasi, rangkuman kegiatan, profil pengajar, dan dokumentasi yang telah disetujui untuk dipublikasikan dapat dikembangkan menjadi artikel dan halaman program. Konten yang relevan dan diperbarui secara konsisten memberi calon peserta lebih banyak titik masuk melalui mesin pencari dan kanal distribusi."},
  {h:"Dari penyelenggaraan menjadi layanan institusi",p:"Pengalaman menyelenggarakan kegiatan dapat dikemas menjadi informasi layanan pelatihan bagi rumah sakit, klinik, puskesmas, organisasi profesi, atau institusi lain. Bentuk kerja sama dan kapasitas pelaksanaannya perlu ditentukan berdasarkan layanan yang memang siap disediakan RLC."}
 ],aside:"Pertanyaan pengembangan",asideText:"Bagaimana RLC dapat mengulang dan memperluas kegiatan dengan pengalaman peserta yang lebih baik, tanpa membuat tim mengulang pekerjaan administrasi dari awal?",evidence:"Peluang di bab ini merupakan analisis atas jenis kegiatan dan jangkauan yang diberitakan. Ini bukan klaim bahwa RLC saat ini belum memiliki proses atau sistem tersebut."},
 {n:"04",slug:"04-institutional-leverage",title:"Institutional Leverage",desc:"Memaksimalkan aset, data, reputasi, dan jaringan",photo:"photo-1500530855697-b586d89ba3ee",lead:"Leverage muncul ketika aset dan aktivitas lembaga dapat digunakan kembali untuk mendukung pertumbuhan berikutnya.",sections:[
  {h:"Content leverage",p:"Konten yang bersumber dari keahlian pengajar, materi edukasi, dan pengalaman kegiatan membantu menjelaskan kapasitas RLC. Konten yang terstruktur juga dapat ditemukan kembali, dibagikan, dan diarahkan ke program terkait. SEO dan distribusi sosial memperluas peluang ditemukan, tetapi hasil traffic tidak dapat dijamin hanya dengan menerbitkan artikel."},
  {h:"Event leverage",p:"Template kegiatan, kalender program, formulir, daftar peserta, komunikasi, dan laporan pascakegiatan dapat dikelola melalui alur yang berulang. Dengan proses yang terdokumentasi, penyelenggaraan kegiatan berikutnya berpotensi lebih konsisten dan tidak selalu dimulai dari pekerjaan administratif yang sama."},
  {h:"Database dan network leverage",p:"Data peserta dan alumni—bila dikumpulkan dengan dasar pemrosesan dan persetujuan yang sesuai—dapat menjadi aset hubungan. Data yang rapi membantu segmentasi komunikasi, pemetaan minat, undangan program lanjutan, dan pengembangan jejaring."},
  {h:"Trust dan credential leverage",p:"Rekam kegiatan, informasi pengajar, dokumen program, serta status dan bukti kredensial yang sah dapat disajikan secara jelas. Sistem dapat membantu pencatatan dan pemeriksaan dokumen internal, tetapi tidak menggantikan kewenangan lembaga atau sistem resmi pemerintah dalam penetapan SKP maupun akreditasi."},
  {h:"Operational leverage",p:"Otomasi tugas berulang—seperti konfirmasi pendaftaran, pengingat jadwal, rekap peserta, dan penerbitan dokumen berdasarkan persetujuan—dapat mengurangi beban administrasi. Tujuannya bukan menghilangkan peran manusia, melainkan memberi tim ruang untuk fokus pada mutu program dan layanan peserta."}
 ],aside:"Ukuran keberhasilan",asideText:"Bukan jumlah fitur yang dipasang, melainkan berkurangnya pekerjaan berulang, meningkatnya keteraturan data, dan kemampuan tim menjalankan program dengan proses yang konsisten.",evidence:"Kerangka leverage adalah analisis dan rekomendasi Maximus. Penerapan harus mengikuti kebijakan privasi, persetujuan peserta, serta ketentuan profesi dan regulasi yang berlaku."},
 {n:"05",slug:"05-integrated-digital-ecosystem",title:"Integrated Digital Ecosystem",desc:"Menghubungkan konten, event, peserta, dan kepercayaan",photo:"photo-1498050108023-c5249f4df085",lead:"Satu lingkungan digital membuat proses yang saling berkaitan tidak berjalan sebagai pulau-pulau terpisah.",sections:[
  {h:"Siklus pertumbuhan",p:"Konten edukasi dan informasi program membantu calon peserta menemukan RLC. Informasi program mengarahkan mereka ke pendaftaran. Kegiatan menghasilkan pengalaman, dokumentasi, dan catatan peserta. Dengan tata kelola yang tepat, peserta dapat memilih untuk tetap terhubung sebagai alumni. Pengalaman dan materi kegiatan kemudian dapat menjadi sumber konten baru."},
  {h:"Alur yang saling terhubung",p:"CONTENT → DISCOVERY → PROGRAM → REGISTRATION → EVENT → PARTICIPANT RECORD → ALUMNI RELATIONSHIP → TRUST & NETWORK → NEXT PROGRAM. Siklus ini bukan jaminan pertumbuhan otomatis. Ia adalah rancangan proses agar informasi dan data dari satu aktivitas dapat mendukung aktivitas berikutnya."},
  {h:"Satu sumber data yang tertata",p:"Informasi program, jadwal, narasumber, peserta, status pendaftaran, dan dokumentasi idealnya tidak perlu dimasukkan berulang kali ke banyak tempat. Sistem terintegrasi dapat menggunakan data yang sama sesuai hak akses, sehingga perubahan informasi lebih mudah diselaraskan."},
  {h:"Manusia tetap memegang keputusan",p:"Sistem membantu mengingatkan, menyusun, memvalidasi format, dan menyiapkan laporan. Keputusan akademik, kelayakan peserta, penilaian kompetensi, persetujuan publikasi, dan penerbitan kredensial tetap berada pada pihak RLC atau otoritas yang berwenang."}
 ],aside:"Prinsip desain",asideText:"Terhubung saat perlu, sederhana saat digunakan, dan tetap memberi kendali kepada RLC atas data serta proses kelembagaannya.",evidence:"Siklus merupakan model konseptual yang diusulkan, bukan gambaran sistem RLC yang sudah berjalan."},
 {n:"06",slug:"06-proposed-digital-environment",title:"Proposed Digital Environment",desc:"Kemampuan sistem sesuai kebutuhan lembaga",photo:"photo-1584982751601-97dcc096659c",lead:"Lingkungan digital dikembangkan dari kebutuhan nyata, bukan dari daftar fitur yang harus dibeli.",sections:[
  {h:"Institutional website",p:"Menjadi pusat informasi resmi yang memuat profil, bidang pelatihan, pengajar, informasi legalitas dan akreditasi berdasarkan dokumen terverifikasi, kontak, serta kanal kemitraan."},
  {h:"Content and knowledge management",p:"Membantu tim menyusun artikel, berita kegiatan, halaman program, materi informasi, dan dokumentasi. Alur editorial dapat mencakup penulis, pemeriksa, persetujuan, jadwal publikasi, dan arsip."},
  {h:"Event and participant management",p:"Mengelola kalender, detail kegiatan, formulir pendaftaran, daftar peserta, status pembayaran bila diperlukan, komunikasi, daftar hadir, dan laporan kegiatan. Otomasi dipilih untuk proses yang berulang dan telah disepakati."},
  {h:"Alumni and credential records",p:"Menyediakan catatan riwayat keikutsertaan dan hubungan alumni. Pengelolaan sertifikat dapat mencakup nomor dokumen, status penerbitan, arsip, dan halaman verifikasi keaslian dokumen yang diterbitkan RLC. Ini tidak sama dengan validasi resmi SKP atau pengakuan kompetensi oleh regulator."},
  {h:"Reporting and integration",p:"Menyajikan ringkasan program, pendaftaran, kehadiran, dan aktivitas publikasi. Integrasi dengan pembayaran, email, WhatsApp, platform pembelajaran, atau sistem pemerintah hanya dilakukan setelah akses, persetujuan, dan kelayakan teknis dipastikan."}
 ],aside:"Pendekatan bertahap",asideText:"Mulai dari website dan proses informasi yang paling dibutuhkan. Modul operasional ditambahkan ketika alur kerja dan penanggung jawabnya sudah jelas.",evidence:"Daftar ini adalah opsi kemampuan yang dapat dirancang. Ruang lingkup final ditetapkan bersama RLC setelah pemetaan proses dan prioritas."},
 {n:"07",slug:"07-roadmap-implementasi",title:"Roadmap Implementasi",desc:"Tahapan pengembangan yang dapat ditinjau",photo:"photo-1506784983877-45594efa4cbe",lead:"Pengembangan dilakukan bertahap agar investasi mengikuti kesiapan organisasi.",sections:[
  {h:"Tahap 1 — Discovery dan validasi",p:"Memetakan tujuan lembaga, jenis program, alur pendaftaran, sumber data, kanal komunikasi, kebutuhan pengguna, dokumen legalitas, dan batas kewenangan. Hasilnya adalah kebutuhan yang disepakati serta prioritas fase pertama."},
  {h:"Tahap 2 — Fondasi informasi",p:"Menyusun struktur website, profil, katalog program, halaman detail, kontak, dan formulir minat atau pendaftaran. Konten dan klaim kelembagaan diterbitkan setelah diperiksa dan disetujui RLC."},
  {h:"Tahap 3 — Operasional kegiatan",p:"Jika dibutuhkan, mengembangkan kalender event, registrasi, database peserta, notifikasi, daftar hadir, dan laporan kegiatan. Proses diuji menggunakan satu atau beberapa kegiatan percontohan."},
  {h:"Tahap 4 — Alumni dan kredensial",p:"Setelah kualitas data dan prosedur disepakati, mengembangkan riwayat peserta, pengelolaan alumni, arsip sertifikat, dan mekanisme verifikasi dokumen internal."},
  {h:"Tahap 5 — Integrasi dan evaluasi",p:"Mengukur penggunaan, kendala, waktu kerja, kualitas data, dan kebutuhan integrasi. Pengembangan berikutnya diputuskan berdasarkan hasil evaluasi, bukan asumsi penambahan fitur."}
 ],aside:"Gerbang keputusan",asideText:"Setiap tahap memiliki hasil, penanggung jawab, dan persetujuan sebelum tahap berikutnya dimulai. Estimasi waktu dan biaya baru dikunci setelah discovery.",evidence:"Roadmap ini merupakan usulan awal. Jadwal, biaya, dan urutan dapat berubah sesuai kesiapan materi, akses, dan keputusan RLC."},
 {n:"08",slug:"08-partnership-growth-framework",title:"Partnership & Growth Framework",desc:"Kolaborasi, tata kelola, dan keberlanjutan",photo:"photo-1521737711867-e3b97375f902",lead:"Ekosistem yang baik harus mudah dikelola oleh tim RLC dan dapat berkembang tanpa ketergantungan teknis yang tidak perlu.",sections:[
  {h:"Peran RLC",p:"RLC menetapkan arah program, standar akademik, pemilik data, kebijakan peserta, persetujuan konten, dan keputusan kelembagaan. Tim RLC tetap memegang kendali atas substansi pendidikan serta hubungan dengan peserta dan mitra."},
  {h:"Peran mitra digital",p:"Mitra membantu memetakan proses, merancang pengalaman pengguna, membangun dan mengintegrasikan sistem, menyiapkan otomasi, menjaga dokumentasi teknis, serta memberikan dukungan sesuai ruang lingkup dan tingkat layanan yang disepakati."},
  {h:"Mengurangi beban teknis",p:"Antarmuka pengelolaan dibuat untuk pengguna nonteknis. Panduan, template, hak akses, dan alur kerja disiapkan agar tim pendidikan tidak harus mengurus kode atau konfigurasi teknis sehari-hari. Kebutuhan pemeliharaan infrastruktur tetap ditangani melalui model dukungan yang disepakati."},
  {h:"Tata kelola dan perlindungan data",p:"Perlu ditentukan siapa yang dapat melihat, mengubah, mengekspor, dan menghapus data. Data pribadi peserta hanya digunakan sesuai tujuan yang dijelaskan, dasar pemrosesan yang sah, pembatasan akses, dan kebijakan retensi. Backup, keamanan, serta prosedur pemulihan menjadi bagian dari rancangan operasional."},
  {h:"Model kerja sama",p:"Kerja sama dapat dimulai dari ruang lingkup prioritas dan dievaluasi setelah digunakan. Pengembangan lanjutan dilakukan bila memberi manfaat yang jelas. RLC tidak diwajibkan mengambil seluruh modul sekaligus; keputusan investasi mengikuti kebutuhan, dampak, dan kemampuan organisasi."}
 ],aside:"Ukuran kemitraan",asideText:"RLC fokus pada pendidikan dan pengembangan kompetensi. Sistem dan dukungan teknis dirancang agar aktivitas pendukung dapat berjalan lebih rapi tanpa membebani tenaga pendidik.",evidence:"Peran, dukungan, biaya pemeliharaan, kepemilikan data, dan tingkat layanan harus dituangkan dalam kesepakatan kerja sebelum implementasi."},
 {n:"09",slug:"09-kesimpulan",title:"Kesimpulan",desc:"Menghubungkan peluang RLC dengan dukungan nyata Maximus",photo:"photo-1497366754035-f200968a6e72",lead:"Peluang yang telah dipetakan dapat diwujudkan melalui ekosistem digital yang dirancang mengikuti kebutuhan dan kapasitas RLC.",sections:[
  {h:"Dari analisis menuju tindakan",p:"Bab-bab sebelumnya menunjukkan hubungan antara aktivitas RLC, peluang pengembangan, dan sistem pendukung yang dapat memperkuatnya. Peran Maximus adalah menerjemahkan analisis tersebut menjadi rancangan, perangkat, dan alur kerja digital yang dapat digunakan oleh tim RLC. Kami tidak memulai dengan memaksakan paket fitur; kami mulai dari proses yang ingin diperbaiki dan kapasitas yang ingin dikembangkan."},
  {h:"Website sebagai fondasi ekosistem",p:"Website yang diusulkan bukan hanya halaman profil. Struktur informasinya disiapkan untuk menjadi pintu masuk ke katalog program, artikel dan publikasi, informasi event, pendaftaran, dokumentasi, serta layanan bagi peserta dan mitra. Dari fondasi ini, fungsi operasional dapat dihubungkan dan dikembangkan sesuai prioritas RLC."},
  {h:"Apa yang dapat kami bangun",p:"Berdasarkan kebutuhan yang telah dibahas, Maximus dapat merancang dan mengembangkan pengelolaan artikel dan konten, kalender serta manajemen event, formulir dan database peserta, database alumni, appointment atau permintaan konsultasi, arsip riwayat pelatihan, pengelolaan sertifikat dan halaman pemeriksaan dokumen yang diterbitkan RLC, dashboard laporan, serta otomasi komunikasi dan administrasi. Modul dipilih berdasarkan proses nyata, bukan seluruhnya harus dibuat sekaligus."},
  {h:"Tentang Live Demo",p:"Live Demo yang ditampilkan dalam proposal merupakan contoh widget dan interaksi untuk memperlihatkan bagaimana sebagian fungsi dapat dihadirkan kepada pengguna. Demo tersebut bukan pernyataan bahwa seluruh halaman, dashboard administrasi, database, atau Content Management System telah selesai dibangun. Implementasi utuh memerlukan pemetaan alur, struktur data, hak akses, integrasi, pengujian, dan persetujuan ruang lingkup bersama RLC."},
  {h:"Dukungan yang dapat dikembangkan bersama Maximus",p:"Bersama tim RLC, Maximus dapat memetakan proses yang berjalan, menyusun prioritas, lalu merancang dan mengembangkan lingkungan digital yang sesuai. Dukungan dapat mencakup penataan website dan katalog program, pengelolaan artikel, manajemen event dan pendaftaran, database peserta dan alumni, appointment atau permintaan konsultasi, arsip riwayat pelatihan, pengelolaan sertifikat, dashboard laporan, serta otomasi administrasi. Tim RLC tetap memegang kendali atas substansi pendidikan dan keputusan kelembagaan, sementara Maximus mendukung sisi perancangan, pengembangan, integrasi, dan pemeliharaan teknis sesuai kesepakatan."},
  {h:"Komitmen pengembangan",p:"Kami siap menjadi mitra pengembangan ekosistem digital RLC secara bertahap. Ukuran keberhasilannya bukan banyaknya fitur, melainkan apakah sistem benar-benar membantu RLC mengelola program, peserta, konten, dan hubungan kelembagaan dengan lebih baik—serta memberi ruang bagi tim untuk berfokus pada pendidikan dan peningkatan kompetensi tenaga kesehatan."}
 ],aside:"Peran Maximus",asideText:"Menerjemahkan kebutuhan dan peluang RLC menjadi website, tools, modul operasional, integrasi, dan otomasi yang saling terhubung. Dibangun bertahap, dikelola dengan mudah, dan mengikuti prioritas lembaga.",evidence:"Ruang lingkup dan kemampuan teknis setiap modul akan divalidasi pada tahap discovery. Fungsi terkait sertifikat, kredensial, SKP, akreditasi, dan integrasi pihak ketiga mengikuti kewenangan serta akses resmi yang berlaku."},
 {n:"10",slug:"10-about-maximus",title:"About Maximus",desc:"Spesialisasi Integrated Digital Environment System",photo:"photo-1497366811353-6870744d04b2",lead:"Maximus membangun lingkungan digital terintegrasi agar organisasi dapat berfokus pada kapasitas utamanya.",sections:[
  {h:"Spesialisasi kami",p:"Maximus memiliki spesialisasi dalam Integrated Digital Environment System: pendekatan untuk merancang dan membangun sistem, tools, data, serta alur kerja digital yang saling mendukung dalam satu lingkungan operasional."},
  {h:"Bukan hanya membuat produk digital",p:"Kami melihat website, aplikasi, database, otomasi, dashboard, dan tools bukan sebagai produk yang berdiri sendiri. Nilainya muncul ketika semuanya membantu proses organisasi secara utuh—mengurangi pekerjaan berulang, memperjelas alur, dan memudahkan pengelolaan."},
  {h:"Pendekatan yang kami terapkan",p:"Dalam proses kerja Maximus sendiri, kami mengembangkan lingkungan yang mencakup website generator, tools pendukung, preview simulator, CSS selector, project brief, dan Client Project Report. Komponen tersebut dibangun untuk membuat pekerjaan pengembangan website lebih terstruktur, mudah ditinjau, dan konsisten."},
  {h:"Dapat diterapkan lintas sektor",p:"Pendekatan integrated environment dapat disesuaikan dengan karakter organisasi. Lembaga pendidikan dapat menghubungkan pembelajaran, peserta, jadwal, dan dokumentasi. Lembaga pelatihan dapat menghubungkan konten, event, alumni, dan rekam pelatihan. Bisnis kuliner dapat menghubungkan katalog, pesanan, pelanggan, operasional, dan promosi. Sistemnya berbeda karena kebutuhan organisasinya berbeda."},
  {h:"Mitra untuk mengembangkan kapasitas",p:"Tujuan Maximus adalah membantu organisasi membangun lingkungan digital yang sesuai dengan cara mereka bekerja dan arah pertumbuhannya. Organisasi tetap berfokus pada keahlian dan layanan utamanya; Maximus mendampingi perancangan, pengembangan, dan dukungan sistem digital yang menopang pekerjaan tersebut."}
 ],aside:"MAXIMUS",asideText:"Integrated Digital Environment Partner — membangun sistem digital yang bekerja sebagai satu lingkungan, bukan sekadar kumpulan produk.",evidence:"Contoh tools internal merupakan gambaran pendekatan kerja Maximus. Detail portofolio, bukti implementasi, dan profil legal perusahaan dapat ditambahkan setelah materi korporat final disetujui."}
];

function renderOverview(){let out='<section class="hero"><div class="hero-copy"><div class="eyebrow">Proposal Pengembangan Digital</div><h1>Rifdaira Learning Center (RLC)</h1><p>Strategi dan solusi digital untuk memperkuat peran RLC sebagai pusat pengembangan kompetensi tenaga kesehatan.</p></div><div class="hero-photo"></div></section><section class="prolog"><span class="prolog-tag">Pengantar Proposal</span><p>RLC telah membangun aktivitas pembelajaran tenaga kesehatan. Proposal ini menguraikan bagaimana kanal digital resmi dapat memperjelas informasi, memperluas jangkauan, dan menyederhanakan pengalaman calon peserta serta mitra institusi.</p></section><section id="proposal"><div class="section-head"><div><span class="section-kicker">ISI PROPOSAL</span><h2>Jelajahi Proposal</h2></div><p>Pilih bab untuk membuka pembahasan lengkap. Setiap kartu menuju halaman tersendiri.</p></div><div class="card-grid">'+chapters.slice(0,3).map(card).join('')+'</div>'+interlude(0)+'<div class="card-grid">'+chapters.slice(3,6).map((c,i)=>card(c,i+3)).join('')+'</div>'+interlude(1)+'<div class="card-grid">'+chapters.slice(6,9).map((c,i)=>card(c,i+6)).join('')+'</div>'+interlude(2)+'<div class="card-grid final-grid">'+chapters.slice(9,10).map((c,i)=>card(c,i+9)).join('')+'</div>+'</section><section class="cta"><div><h2>Mari Bangun Ekosistem Digital RLC</h2><p>Diskusikan ruang lingkup dan langkah awal pengembangan bersama Webdesk.</p></div><a href="#ringkasan">Diskusikan Proposal ↗</a></section><section class="summary" id="ringkasan"><h2>Ringkasan Penawaran</h2><div class="summary-grid"><div class="summary-item"><small>Solusi</small><strong>Website & Integrated Training Environment</strong></div><div class="summary-item"><small>Estimasi investasi awal</small><strong>Rp14.500.000</strong></div><div class="summary-item"><small>Estimasi pengerjaan</small><strong>4–6 minggu</strong></div><div class="summary-item"><small>Status</small><strong>Menunggu pembahasan</strong></div></div></section><footer class="footer"><span><strong>Webdesk</strong> by Maximus Lab</span><span>Proposal pengembangan digital untuk RLC · 2026</span></footer>';document.getElementById("main").innerHTML=out;reveal()}
function interlude(i){const q=interludes[i];return '<section class="interlude '+(i===1?'reverse':'')+'"><div class="interlude-copy"><span class="interlude-label">A moment to reflect · 0'+(i+1)+'</span><blockquote>“'+q.quote+'”</blockquote></div><div class="interlude-photo" style="background-image:url('+image(q.photo,1200)+')"></div></section>'}
function renderChapter(c){const i=chapters.indexOf(c),prev=chapters[i-1],next=chapters[i+1];document.title=c.title+' — Proposal RLC';const body=c.sections.map(s=>'<section class="chapter-section"><h2>'+s.h+'</h2><p>'+s.p+'</p></section>').join('');const evidence=c.evidence?'<div class="evidence-note"><strong>Dasar informasi & batas analisis</strong><p>'+c.evidence+'</p></div>':'';document.getElementById("main").innerHTML='<section class="chapter-page"><div class="crumb"><a href="/penawaran/rlc/">Proposal RLC</a> / '+c.title+'</div><section class="chapter-hero"><div class="chapter-bg" style="background-image:url('+image(c.photo,1400)+')"></div><div class="chapter-hero-copy"><span class="chapter-index">BAB '+c.n+' / 10</span><h1>'+c.title+'</h1><p>'+c.lead+'</p></div></section><div class="chapter-body"><article class="chapter-panel">'+body+evidence+'</article><aside class="chapter-aside"><strong>'+c.aside+'</strong><p>'+c.asideText+'</p></aside></div><nav class="chapter-nav">'+(prev?'<a href="/penawaran/rlc/bab/'+prev.slug+'/">← '+prev.title+'</a>':'<a href="/penawaran/rlc/">← Kembali ke Overview</a>')+(next?'<a class="next" href="/penawaran/rlc/bab/'+next.slug+'/">'+next.title+' →</a>':'<a class="next" href="/penawaran/rlc/">Kembali ke Ringkasan →</a>')+'</nav></section><footer class="footer"><span><strong>Webdesk</strong> by Maximus Lab</span><span>Proposal pengembangan digital untuk RLC · 2026</span></footer>'}
function reveal(){const els=document.querySelectorAll(".chapter-card");if(!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("revealed"));return}const io=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){const el=entry.target;const siblings=[...el.parentElement.querySelectorAll(".chapter-card")];el.style.transitionDelay=(siblings.indexOf(el)*110)+"ms";el.classList.add("revealed");io.unobserve(el)}}),{threshold:.12,rootMargin:"0px 0px -35px 0px"});els.forEach(el=>io.observe(el))}
const path=decodeURI(location.pathname),slug=path.match(/\/bab\/([^/]+)/)?.[1],current=chapters.find(c=>c.slug===slug);if(current)renderChapter(current);else renderOverview();
const sidebar=document.getElementById("sidebar"),app=document.getElementById("app");document.getElementById("sideToggle").addEventListener("click",()=>{sidebar.classList.toggle("open");app.classList.toggle("sidebar-open")});document.getElementById("mobileMenu").addEventListener("click",()=>sidebar.classList.toggle("open"));document.addEventListener("keydown",e=>{if(e.key==="Escape"){sidebar.classList.remove("open");app.classList.remove("sidebar-open")}});
</script>
</body></html>
