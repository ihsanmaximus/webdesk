<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>MaxLab Test — Published Navbar</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .site-nav{position:relative;z-index:20;min-height:76px;padding:14px clamp(18px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:24px;background:#6b4f3a;border-bottom:1px solid #80634b;color:#fff}
    .brand{display:flex;align-items:center;gap:12px;min-width:0;color:#fff;font-weight:750;font-size:18px}
    .brand img{width:42px;height:42px;object-fit:contain;border-radius:8px}
    .nav-links{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.5vw,34px);flex-wrap:wrap}
    .nav-links a{color:#fff7ed;text-decoration:none;font-size:14px;font-weight:600;transition:color .2s ease}
    .nav-links a:hover{color:#e7c99f}
    .cta{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;background:#e4c9a4;color:#493524;text-decoration:none;font-size:14px;font-weight:750;white-space:nowrap}
    .nav-toggle{display:none;width:44px;height:44px;padding:9px;border:1px solid rgba(255,255,255,.35);border-radius:9px;background:transparent;color:#fff;cursor:pointer}
    .nav-toggle span{display:block;height:2px;margin:6px 0;background:currentColor;border-radius:2px;transition:transform .2s ease,opacity .2s ease}
    main{width:min(920px,calc(100% - 36px));margin:72px auto;padding:32px;border:1px solid #e1e6ee;border-radius:18px;background:#fff}
    h1{margin:0 0 10px;font-size:26px}
    p{margin:0;color:#667085;line-height:1.7}
    .status{margin-top:18px;font-size:12px;color:#667085}
    @media(max-width:767px){
      .site-nav{min-height:68px;padding:12px 18px;gap:12px}
      .brand{font-size:17px;flex:1}
      .nav-toggle{display:block;flex:0 0 44px}
      .nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg)}
      .nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
      .nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
      .nav-links{position:absolute;top:100%;left:0;right:0;display:none;flex-direction:column;align-items:stretch;gap:0;padding:8px 18px 16px;background:#6b4f3a;border-top:1px solid rgba(255,255,255,.16);box-shadow:0 12px 24px rgba(42,28,18,.2)}
      .nav-links.is-open{display:flex;animation:menuDrop .2s ease-out}
      .nav-links a{display:block;padding:14px 8px;border-bottom:1px solid rgba(255,255,255,.14);font-size:15px}
      .nav-links a:last-child{border-bottom:0}
      .cta{padding:10px 13px;font-size:13px}
      main{margin:28px auto;padding:24px}
    }
    @keyframes menuDrop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
    @media(prefers-reduced-motion:reduce){.nav-links.is-open{animation:none}}
  </style>
</head>
<body>
  <header class="site-nav" id="site-navbar">
    <div class="brand" id="site-brand">MaxLab Test</div>
    <nav class="nav-links" id="site-menu" aria-label="Navigasi utama"></nav>
    <a class="cta" id="site-cta" href="#" hidden></a>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Buka menu">
      <span></span><span></span><span></span>
    </button>
  </header>
  <main>
    <h1 id="page-title">MaxLab Frontend Test</h1>
    <p id="page-message">Memuat konfigurasi yang sudah dipublikasikan...</p>
    <div class="status" id="render-status"></div>
  </main>
  <script>
    (function initMobileNav(){
      const toggle=document.getElementById("nav-toggle");
      const menu=document.getElementById("site-menu");
      if(!toggle||!menu)return;
      function setOpen(open){
        menu.classList.toggle("is-open",open);
        toggle.setAttribute("aria-expanded",String(open));
        toggle.setAttribute("aria-label",open?"Tutup menu":"Buka menu");
      }
      toggle.addEventListener("click",()=>setOpen(!menu.classList.contains("is-open")));
      menu.addEventListener("click",event=>{if(event.target.closest("a"))setOpen(false)});
      document.addEventListener("keydown",event=>{if(event.key==="Escape")setOpen(false)});
      window.addEventListener("resize",()=>{if(window.innerWidth>767)setOpen(false)});
    })();

    (async function renderPublishedNavbar(){
      const message=document.getElementById("page-message");
      const status=document.getElementById("render-status");
      try{
        const response=await fetch("/api/maxlab/navbar?slug=maxlabtest",{cache:"no-store"});
        const data=await response.json();
        if(!response.ok) throw new Error(data.error||"Gagal mengambil konfigurasi.");
        const config=data.config;
        if(!config||config.status!=="published"){
          message.textContent="Belum ada Navbar yang dipublikasikan. Simpan konfigurasi di MaxLab Admin, lalu tekan Publish.";
          status.textContent="Status: menunggu Publish";
          return;
        }
        const brand=document.getElementById("site-brand");
        brand.textContent="";
        if(config.logo_url){
          const logo=document.createElement("img");logo.src=config.logo_url;logo.alt="";
          brand.appendChild(logo);
        }
        const name=document.createElement("span");name.textContent=config.brand_name||data.website?.name||"Website";brand.appendChild(name);
        const menu=document.getElementById("site-menu");menu.textContent="";
        (data.menuItems||[]).filter(item=>item.is_active!==false).forEach(item=>{
          const link=document.createElement("a");link.textContent=item.label||"Menu";link.href=item.target_url||"#";menu.appendChild(link);
        });
        const cta=document.getElementById("site-cta");
        if(config.whatsapp_number&&config.cta_label){
          cta.href="https://wa.me/"+config.whatsapp_number.replace(/[^0-9]/g,"");
          cta.textContent=config.cta_label;cta.hidden=false;
        }
        document.getElementById("page-title").textContent=config.brand_name||"Website";
        message.textContent="Navbar berhasil dirender dari konfigurasi yang berstatus Published.";
        status.textContent="Terakhir diperbarui: "+(config.updated_at?new Date(config.updated_at).toLocaleString("id-ID"):"—");
      }catch(error){
        message.textContent=error.message;
        status.textContent="Render gagal";
      }
    })();
  </script>
</body>
</html>
