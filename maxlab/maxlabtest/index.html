<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>MaxLab Test — Published Navbar</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .site-nav{min-height:76px;padding:14px clamp(18px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:24px;background:#fff;border-bottom:1px solid #e8edf4}
    .brand{display:flex;align-items:center;gap:12px;min-width:0;font-weight:750;font-size:18px}.brand img{width:42px;height:42px;object-fit:contain;border-radius:8px}
    .nav-links{display:flex;align-items:center;justify-content:center;gap:clamp(14px,2.5vw,34px);flex-wrap:wrap}.nav-links a{color:#475467;text-decoration:none;font-size:14px;font-weight:600}
    .cta{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:10px;background:#384deb;color:white;text-decoration:none;font-size:14px;font-weight:700;white-space:nowrap}
    main{width:min(920px,calc(100% - 36px));margin:72px auto;padding:32px;border:1px solid #e1e6ee;border-radius:18px;background:#fff}
    h1{margin:0 0 10px;font-size:26px}p{margin:0;color:#667085;line-height:1.7}.status{margin-top:18px;font-size:12px;color:#667085}
    @media(max-width:680px){.site-nav{align-items:flex-start;flex-wrap:wrap}.nav-links{order:3;width:100%;justify-content:flex-start}.cta{margin-left:auto}main{margin:28px auto;padding:24px}}
  </style>
</head>
<body>
  <header class="site-nav" id="site-navbar">
    <div class="brand" id="site-brand">MaxLab Test</div>
    <nav class="nav-links" id="site-menu" aria-label="Navigasi utama"></nav>
    <a class="cta" id="site-cta" href="#" hidden></a>
  </header>
  <main>
    <h1 id="page-title">MaxLab Frontend Test</h1>
    <p id="page-message">Memuat konfigurasi yang sudah dipublikasikan...</p>
    <div class="status" id="render-status"></div>
  </main>
  <script>
    (async function renderPublishedNavbar(){
      const message=document.getElementById("page-message");
      const status=document.getElementById("render-status");
      try{
        const response=await fetch("/api/maxlab/navbar?slug=maxlabtest",{cache:"no-store"});
        const data=await response.json();
        if(!response.ok) throw new Error(data.error||"Gagal mengambil konfigurasi.");
        const config=data.config;
        if(!config||config.status!=="published"){
          message.textContent="Belum ada Navbar yang dipublikasikan. Simpan konfigurasi di MaxLab Admin, lalu tekan Publish.";
          status.textContent="Status: menunggu Publish";
          return;
        }
        const brand=document.getElementById("site-brand");
        brand.textContent="";
        if(config.logo_url){
          const logo=document.createElement("img");logo.src=config.logo_url;logo.alt="";
          brand.appendChild(logo);
        }
        const name=document.createElement("span");name.textContent=config.brand_name||data.website?.name||"Website";brand.appendChild(name);
        const menu=document.getElementById("site-menu");menu.textContent="";
        (data.menuItems||[]).filter(item=>item.is_active!==false).forEach(item=>{
          const link=document.createElement("a");link.textContent=item.label||"Menu";link.href=item.target_url||"#";menu.appendChild(link);
        });
        const cta=document.getElementById("site-cta");
        if(config.whatsapp_number&&config.cta_label){
          cta.href="https://wa.me/"+config.whatsapp_number.replace(/[^0-9]/g,"");
          cta.textContent=config.cta_label;cta.hidden=false;
        }
        document.getElementById("page-title").textContent=config.brand_name||"Website";
        message.textContent="Navbar berhasil dirender dari konfigurasi yang berstatus Published.";
        status.textContent="Terakhir diperbarui: "+(config.updated_at?new Date(config.updated_at).toLocaleString("id-ID"):"—");
      }catch(error){
        message.textContent=error.message;
        status.textContent="Render gagal";
      }
    })();
  </script>
</body>
</html>
